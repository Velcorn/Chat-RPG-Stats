name: collect

on:
  schedule:
    # Every 15 minutes, round the clock (the game's play window moves now and then, the data does not mind the night).
    # (The host's systemd timer is the one that really runs it; this is the fallback.)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      full_top:
        description: Das ganze Top 100 in diesem Lauf lesen
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "src/**", ".github/workflows/collect.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Datenzweig holen
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null; then
            git clone --quiet --branch data --single-branch --depth 1 "$REMOTE" data
          else
            git init --quiet -b data data && git -C data remote add origin "$REMOTE"
          fi
      - name: Sammeln
        id: collect
        if: github.event_name != 'push'
        run: uv run --no-dev python src/collect.py --data data --part core
      - name: Beobachtungsliste abgleichen
        if: steps.collect.outputs.collected == 'true'
        id: watchlist
        run: uv run --no-dev python src/watchlist.py --sync data/state.json >> "$GITHUB_OUTPUT"
      - name: Beobachtungsliste speichern
        if: steps.watchlist.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.txt
          git commit --quiet -m "Watchlist: Top 100 abgeglichen"
          # A push from here does not start this workflow again (its paths do not include the list); main may have
          # moved meanwhile, so rebase and try a few times.
          for wait in 0 10 30; do
            sleep "$wait"
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && exit 0
          done
          exit 0
      - name: Daten sichern
        if: steps.collect.outputs.collected == 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          # GitHub answers a push with a 500 now and then (15:00 UTC on 14.10.2026): try again a few times.
          for wait in 0 10 30; do
            sleep "$wait"
            git push --quiet origin data && exit 0
          done
          exit 1
      - name: Seite bauen
        id: build
        if: (steps.collect.outputs.collected == 'true' || github.event_name == 'push') && hashFiles('data/state.json') != ''
        run: uv run --no-dev python src/build.py --data data --out _site
      - uses: actions/upload-pages-artifact@v5
        if: steps.build.outcome == 'success'
        with:
          path: _site
      - id: deploy
        if: steps.build.outcome == 'success'
        uses: actions/deploy-pages@v5

  # The second half of a run: the profiles (watchlist, the board's top 100 once a day, a slice of the other active
  # players) take about two minutes of the run, so the page is published without them first; the next run's page has them.
  profiles:
    needs: collect
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Datenzweig holen
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: git clone --quiet --branch data --single-branch --depth 1 "$REMOTE" data
      - name: Profile lesen
        id: collect
        run: uv run --no-dev python src/collect.py --data data --part profiles ${{ inputs.full_top && '--full-top' || '' }}
      - name: Daten sichern
        if: steps.collect.outputs.collected == 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Profile $(date -u +%Y-%m-%dT%H:%MZ)"
          # GitHub answers a push with a 500 now and then (15:00 UTC on 14.10.2026): try again a few times.
          for wait in 0 10 30; do
            sleep "$wait"
            git push --quiet origin data && exit 0
          done
          exit 1
