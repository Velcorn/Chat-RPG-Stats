name: Beobachtungsliste

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  update:
    if: contains(github.event.issue.labels.*.name, 'beobachtungsliste')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Liste ändern
        id: change
        env:
          BODY: ${{ github.event.issue.body }}
        run: uv run --no-dev python src/watchlist.py >> "$GITHUB_OUTPUT"
      - name: Speichern
        if: steps.change.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.txt
          git commit --quiet -m "Watchlist: ${{ steps.change.outputs.summary }}"
          # the collector may have pushed meanwhile (that is what rejected the push of issue 8): rebase and retry
          for try in 1 2 3 4; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((try * 5))
          done
          exit 1
      - name: Antworten und schließen
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.change.outputs.message }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo "${{ github.repository }}" --body "$MESSAGE"
          gh issue close ${{ github.event.issue.number }} --repo "${{ github.repository }}"
