[project]
name = "chat-rpg-stats"
version = "2026.10.28"
description = "Öffentliches Statistik-Dashboard für das Twitch-Chat-RPG rpg.sola.rip"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "prek>=0.5.4",
    "ruff",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "RUF"]

[tool.uv]
package = false

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
