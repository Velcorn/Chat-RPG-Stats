<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat-RPG Statistik</title>
<meta name="description" content="Ranglisten, Verlauf und Prognosen für das Twitch-Chat-RPG rpg.sola.rip">
<style>
  :root {
    color-scheme: dark;
    --page: #131312;
    --surface-1: #1a1a19;
    --surface-2: #262624;
    --border: #383835;
    --grid: #2c2c2a;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-2: #d99a1c;
    --accent: #3987e5;
    --good: #2fae6d;
    --warning: #d99a1c;
    --critical: #e5534b;
    --atk: #e5534b;
    --def: #3987e5;
    --sup: #2fae6d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--text-primary);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1440px; margin: 0 auto; padding: 12px clamp(12px, 3vw, 20px); display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  header .tabs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs a { color: var(--text-secondary); text-decoration: none; padding: 5px 12px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--surface-2); }
  .tabs a:hover { border-color: var(--text-muted); }
  .tabs a[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--text-primary); }
  .sub { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .sub a { padding: 3px 10px; font-size: 13px; background: none; border-color: transparent; }
  .sub a[aria-current] { background: var(--surface-2); border-color: var(--border); color: var(--text-primary); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h1 a { color: inherit; text-decoration: none; }
  h2 { font-size: 13px; margin: 0 0 10px; font-weight: 600; color: var(--text-secondary);
       text-transform: uppercase; letter-spacing: .06em; }
  a { color: var(--accent); }
  .muted { color: var(--text-muted); }
  .secondary { color: var(--text-secondary); }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; }
  .grid { display: grid; gap: 12px; min-width: 0; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .two { grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); }
  .tile { padding: 10px 12px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .tile.kk { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-content: start; }
  .tile.kk .sub { grid-column: 1 / -1; }
  .tile .pwl { text-transform: none; letter-spacing: 0; }
  .tile .pwv { align-self: start; margin-top: 8px; font-size: 13px; font-weight: 650; line-height: 1.2; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .tile .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 2px 0; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { .tile .value { font-size: 20px; } .tile .pwv { font-size: 10px; margin-top: 6px; } .tile.kk { grid-column: 1 / -1; } }
  input, button { font: inherit; color: var(--text-primary); background: var(--surface-2);
                  border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; }
  button { cursor: pointer; } button:hover { border-color: var(--text-muted); }
  .seg { display: inline-flex; gap: 4px; }
  .seg button { padding: 2px 10px; font-size: 12px; }
  .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); }
  h2.divider { margin: 6px 0 -4px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .head.start { justify-content: flex-start; gap: 12px; }
  .card > .head { margin-bottom: 8px; }
  .head h2 { margin: 0; }
  .streams { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .stream .head { margin-bottom: 4px; }
  .stream .lines { display: grid; gap: 2px; margin: 8px 0; }
  .stream .lines div { display: flex; justify-content: space-between; gap: 8px; }
  h3 { font-size: 13px; margin: 14px 0 0; font-weight: 600; }
  .era { margin-bottom: 4px; }
  h2.section { font-size: 15px; margin: 10px 0 0; color: var(--text-secondary); }
  .rules { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 14px; margin: 0; }
  .rules dt { color: var(--text-secondary); }
  .rules dd { margin: 0; display: grid; gap: 1px; }
  .rules dd .muted { font-size: 12px; }
  @media (max-width: 600px) { .rules { grid-template-columns: 1fr; } .rules dd { margin-bottom: 6px; } }
  .pill { padding: 1px 9px; border-radius: 10px; font-size: 12px; border: 1px solid var(--border); color: var(--text-muted); }
  .pill.on { background: var(--good); border-color: var(--good); color: #fff; }
  .search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
  .search input { width: 100%; }
  .card .search { max-width: none; }
  .suggest { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 5; background: var(--surface-2);
             border: 1px solid var(--border); border-radius: 6px; max-height: 320px; overflow: auto; }
  .suggest a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; color: var(--text-primary);
               text-decoration: none; }
  .suggest a:hover, .suggest a.on { background: var(--surface-1); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface-1); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td a { color: var(--text-primary); text-decoration: none; } td a:hover { text-decoration: underline; }
  .scroll { max-height: 520px; overflow: auto; }
  .wide-table { overflow-x: auto; }
  .up { color: var(--good); } .down { color: var(--critical); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2);
         border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; margin-left: 6px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart .axis text { fill: var(--text-muted); font-size: 11px; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 5; }
  .chart .line { fill: none; stroke: var(--series-1); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .chart .end { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
  .chart .halo { fill: var(--series-1); opacity: .22; }
  .chart .pill { fill: var(--series-1); }
  .chart .endlabel { fill: #fff; font-size: 12px; font-weight: 700; }
  .chart .band { fill: var(--series-1); }
  .chart .bandlabel { fill: var(--text-muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .chart .hair { stroke: var(--text-muted); stroke-width: 1; }
  .chart .empty { fill: var(--text-muted); font-size: 13px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
         border-radius: 6px; padding: 6px 9px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .tip strong { display: block; font-size: 14px; }
  .tip .key { display: inline-block; width: 12px; height: 2px; background: var(--series-1); vertical-align: middle; margin-right: 6px; }
  .gear { display: grid; }
  .grow { display: grid; grid-template-columns: 44px 34px minmax(0, 1fr) repeat(3, 62px); gap: 0 12px; align-items: center;
          padding: 8px 0; border-top: 1px solid var(--grid); }
  .grow.head { border-top: 0; padding: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
               color: var(--text-muted); }
  .grow.head .s, .grow.sum .s { text-align: right; }
  .grow.head .atk { color: var(--atk); } .grow.head .def { color: var(--def); } .grow.head .sup { color: var(--sup); }
  .grow.sum { border-top: 1px solid var(--border); font-weight: 600; }
  .grow.sum .lead { grid-column: 1 / 4; }
  .grow .kk { display: block; font-size: 12px; font-weight: 400; color: var(--text-secondary); }
  .grow .chip { justify-self: start; min-width: 30px; text-align: center; font-size: 12px; font-weight: 700; padding: 2px 0; position: relative;
                border-radius: 6px; color: var(--text-primary); background: color-mix(in srgb, var(--c, var(--accent)) 62%, var(--surface-2));
                border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 90%, transparent); text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
  .grow .chip .ico { position: absolute; top: -6px; width: 12px; height: 12px; filter: drop-shadow(0 0 1px rgba(0, 0, 0, .9)); }
  .grow .chip .ico svg { display: block; width: 100%; height: 100%; }
  .grow .chip .lock { left: -4px; color: var(--text-primary); }
  .grow .chip .gem { right: -3px; }
  .grow .chip .gem.atk { color: var(--atk); } .grow .chip .gem.def { color: var(--def); } .grow .chip .gem.sup { color: var(--sup); }
  .grow .piece { min-width: 0; overflow-wrap: anywhere; }
  .grow .dur { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .grow .dur.worn { color: var(--warning); } .grow .dur.broken { color: var(--critical); }
  .grow .dur.full { color: var(--text-muted); }
  .grow .s { text-align: right; font-variant-numeric: tabular-nums; }
  .grow .s i { display: block; height: 3px; margin: 3px 0 0 auto; border-radius: 2px; background: var(--c); }
  .grow .s.zero { color: var(--text-muted); } .grow .s.zero i { display: none; }
  .grow .s.atk { --c: var(--atk); } .grow .s.def { --c: var(--def); } .grow .s.sup { --c: var(--sup); }
  .grow .s.sum { font-size: 15px; color: var(--c); }
  @media (max-width: 600px) {
    .grow { grid-template-columns: 34px repeat(3, minmax(0, 1fr)) 48px; row-gap: 5px; }
    .grow.head { display: none; }
    .grow .chip { grid-column: 1; grid-row: 1; }
    .grow .piece { grid-column: 2 / 6; grid-row: 1; }
    .grow .dur { grid-column: 5; grid-row: 2; text-align: right; }
    .grow .dur::before { content: "D "; font-size: 10px; letter-spacing: .08em; color: var(--text-muted); }
    .grow .s { grid-column: auto; text-align: left; }
    .grow .s i { margin-left: 0; }
    .grow .s.atk { grid-column-start: 2; }
    .grow .s::before { content: attr(data-l); font-size: 10px; letter-spacing: .08em; color: var(--c); margin-right: 5px; }
    .grow.sum .lead { grid-column: 1 / 6; }
  }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  .facts dt { color: var(--text-secondary); } .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 100px 1fr 80px; gap: 8px; align-items: center; font-size: 13px; }
  .bar .track { position: relative; height: 18px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; height: 9px; background: var(--c, var(--series-1)); }
  .bar .peer { position: absolute; left: 0; bottom: 0; height: 9px; background: color-mix(in srgb, var(--c, var(--series-2)) 38%, transparent); }
  .bar.atk { --c: var(--atk); } .bar.def { --c: var(--def); } .bar.sup { --c: var(--sup); }
  .bar .name { display: flex; align-items: center; gap: 7px; }
  .bar .name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .forms-col > .card:last-child { display: flex; flex-direction: column; }
  .forms-col > .card:last-child .wide-table { flex: 1; }
  .forms-col > .card:last-child table { height: 100%; }
  .forms { table-layout: fixed; width: 100%; }
  .forms td:first-child, .forms td.seen-col { white-space: nowrap; }
  .forms th:nth-child(1) { width: 27%; } .forms th:nth-child(2) { width: 20%; }
  .forms th:nth-child(3), .forms th:nth-child(4), .forms th:nth-child(5) { width: 9%; } .forms th:nth-child(6) { width: 26%; }
  .mixbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
  .mixbar span { display: block; } .mixbar .atk { background: var(--atk); } .mixbar .def { background: var(--def); } .mixbar .sup { background: var(--sup); }
  .forms td.main { font-weight: 600; color: var(--text-primary); } .forms td.num { color: var(--text-secondary); }
  .forms tr.group td { padding-top: 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border-bottom: none; }
  .forms tr.group.atk td { color: var(--atk); } .forms tr.group.def td { color: var(--def); } .forms tr.group.sup td { color: var(--sup); }
  .forms .unseen { color: var(--text-muted); font-style: italic; }
  .forms .seen { display: none; font-size: 12px; color: var(--text-muted); }
  @media (max-width: 600px) {
    .forms .mix, .forms .seen-col { display: none; }
    .forms th:nth-child(1) { width: 46%; } .forms th:nth-child(3), .forms th:nth-child(4), .forms th:nth-child(5) { width: 18%; }
    .forms .seen { display: block; }
  }
  .bar .val { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .legend .you { background: linear-gradient(90deg, var(--atk) 33%, var(--def) 33% 66%, var(--sup) 66%); }
  .legend .peers { background: linear-gradient(90deg, color-mix(in srgb, var(--atk) 38%, transparent) 33%,
                    color-mix(in srgb, var(--def) 38%, transparent) 33% 66%, color-mix(in srgb, var(--sup) 38%, transparent) 66%); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .note { color: var(--text-secondary); font-size: 13px; margin: 6px 0 0; }
  .log h3 { font-size: 14px; margin: 14px 0 6px; color: var(--text-secondary); font-weight: 600; }
  .log details { border-top: 1px solid var(--border, #2a2a28); padding: 6px 0; }
  .log summary { cursor: pointer; }
  .log details ul { margin: 6px 0 4px; padding-left: 18px; color: var(--text-secondary); font-size: 13px; }
  .log details li { margin-top: 3px; }
  .log details h4 { margin: 8px 0 0; font-size: 13px; color: var(--text); }
  .log .rule { font-size: 13px; color: var(--text-secondary); padding: 3px 0; }
  ul.note { padding-left: 18px; }
  ul.note li { margin-top: 6px; }
  footer { color: var(--text-muted); font-size: 12px; padding: 8px 0 20px; }
  footer a { color: var(--text-secondary); }
</style>
</head>
<body>
<main>
  <header>
    <h1><a href="#/">Chat-RPG Statistik</a></h1>
    <div class="search">
      <input id="q" type="search" placeholder="Spieler suchen (Twitch-Name)" autocomplete="off" aria-label="Spieler suchen">
      <div id="suggest" class="suggest" hidden></div>
    </div>
    <nav class="tabs">
      <a href="#/start" data-view="start">Start</a>
      <a href="#/rangliste" data-view="rangliste">Ranglisten</a>
      <a href="#/gilden" data-view="gilden">Gilden</a>
      <a href="#/kaempfe" data-view="kaempfe">Kämpfe</a>
      <a href="#/spiel" data-view="spiel">Spiel</a>
    </nav>
  </header>
  <nav id="subtabs" class="tabs sub" aria-label="Bereich" hidden></nav>
  <div id="view" class="grid"></div>
  <footer id="footer"></footer>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const fmtInt = (n) => n == null ? "-" : Math.round(n).toLocaleString("de-DE");
const fmtDec = (n, d = 1) => n == null ? "-" : n.toLocaleString("de-DE", { maximumFractionDigits: d });
const count = (n, one, many) => `${fmtInt(n)} ${n == 1 ? one : many}`;  // count(1, "Punkt", "Punkte") -> "1 Punkt"
// Every amount in silver (never gold), with the German thousands separator: 1234 -> "1.234 Silber".
const fmtSilver = (s) => s == null ? "-" : `${fmtInt(s)} Silber`;
const signed = (n, d = 0) => n == null ? "-" : (n > 0 ? "+" : "") + (d ? fmtDec(n, d) : fmtInt(n));
const TZ = "Europe/Berlin";  // the game runs on Berlin time, whatever device views the page
const fmtTime = (t) => new Date(t * 1000).toLocaleString("de-DE", { timeZone: TZ, weekday: "short", day: "2-digit",
  month: "2-digit", hour: "2-digit", minute: "2-digit" });
const GAME = "https://rpg.sola.rip";
const gameLink = (path, text) => el("a", { href: GAME + path, target: "_blank", rel: "noopener" }, text);
const fmtSince = (t) => new Date(t * 1000).toLocaleString("de-DE", { timeZone: TZ, day: "2-digit", month: "2-digit",
  year: "numeric", hour: "2-digit", minute: "2-digit" }) + " Uhr";
const fmtClock = (t) => new Date(t * 1000).toLocaleTimeString("de-DE", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const iso = (s) => s ? Date.parse(s) / 1000 : null;
const pct = (a, b) => b ? `${fmtDec(100 * a / b, 0)} %` : "-";
// "in weniger als einem Tag" / "in etwa 3 Tagen"
const inDays = (d) => d < 1 ? "in weniger als einem Tag" : `in etwa ${count(Math.ceil(d), "Tag", "Tagen")}`;
const KINDS = { BOSS: "Boss", ADVENTURE: "Abenteuer", RAID: "Überfall" };
const fightLabel = (f) => f.kind === "BOSS" ? `Boss ${f.name || ""}, Stufe ${f.level ?? f.bossLevel ?? "?"}`
  : `${KINDS[f.kind] || f.kind} Schwierigkeit ${f.level ?? f.difficulty ?? "?"}`;
// The repo behind the page (user.github.io/repo), for the watchlist form and the footer.
const REPO = location.hostname.endsWith(".github.io")
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}` : "Velcorn/Chat-RPG-Stats";
const WATCH_FORM = `https://github.com/${REPO}/issues/new?template=watchlist.yml`;

const cache = {};
function load(path) {
  if (!cache[path]) {
    cache[path] = fetch("data/" + path).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
    cache[path].catch(() => delete cache[path]);
  }
  return cache[path];
}

function tile(label, value, sub, power) {
  return el("div", { class: "card tile" + (power == null ? "" : " kk") },
    el("div", { class: "label" }, label), power == null ? null : el("div", { class: "label pwl", title: "Ausrüstung plus Talente; der Rang zählt nur die Ausrüstung" }, "Kampfkraft"),
    el("div", { class: "value", title: value }, value), power == null ? null : el("div", { class: "pwv" }, fmtInt(power)),
    el("div", { class: "sub" }, sub ?? ""));
}
function card(title, ...body) { return el("section", { class: "card" }, title ? el("h2", {}, title) : null, ...body); }
function delta(n, d = 0) { return el("span", { class: n > 0 ? "up" : n < 0 ? "down" : "muted" }, signed(n, d)); }
function playerLink(r) { return el("a", { href: `#/spieler/${r.login}` }, r.name || r.login); }
function table(cols, rows) {
  return el("div", { class: "wide-table" }, el("table", {},
    el("thead", {}, el("tr", {}, cols.map((c) => el("th", { class: c.num ? "num" : null, title: c.title }, c.label)))),
    el("tbody", {}, rows.map((r) => el("tr", {}, cols.map((c) => el("td", { class: c.num ? "num" : null }, c.get(r))))))));
}
function seg(options, current, onPick) {
  const box = el("div", { class: "seg" });
  for (const [key, label] of options) {
    const b = el("button", { "aria-pressed": String(key === current) }, label);
    b.addEventListener("click", () => {
      for (const o of box.children) o.setAttribute("aria-pressed", String(o === b));
      onPick(key);
    });
    box.append(b);
  }
  return box;
}

// ---- chart (a line chart drawn as steps: a value holds until the next change) ----
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
  const ticks = [];
  for (let v = Math.floor(lo / step) * step; v < hi + step - step * 1e-9; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return ticks;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs = {}, text) {
  const n = document.createElementNS(SVGNS, tag);

  if (text != null) n.textContent = text;

function lineChart(box, points, { label, fmt = fmtInt, invert = false, until, empty = "noch keine Daten",
  missing = invert ? "nicht in den Top 100" : "-" }) {
  box.replaceChildren();
  if (until && points.length && until > points[points.length - 1].t) points = [...points, { t: until, v: points[points.length - 1].v }];
  const lastPt = points.filter((p) => p.v != null).pop();
  const endText = lastPt ? (invert ? "#" + lastPt.v : fmt(lastPt.v)) : "";
  const W = Math.max(220, box.clientWidth), H = 220, m = { l: 60, r: 28 + endText.length * 7.6, t: 10, b: 22 };
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });
  box.append(svg);
  const pts = points.filter((p) => p.v != null);
  if (pts.length === 0) {
    svg.append(sv("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "empty" }, empty));
    return;
  }
  const t0 = Math.min(...points.map((p) => p.t)), t1 = Math.max(...points.map((p) => p.t));
  let lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v));
  let ticks = niceTicks(lo, hi).filter((v) => Number.isInteger(v));
  if (invert) ticks = [...new Set(ticks.map((v) => Math.max(1, v)))];
  if (!ticks.length) ticks = [lo];
  lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  if (lo === hi) hi = lo + 1;
  const x = (t) => m.l + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (v) => { const f = (v - lo) / (hi - lo); return m.t + (invert ? f : 1 - f) * (H - m.t - m.b); };
  const axis = sv("g", { class: "axis" });
  for (const v of ticks) {
    axis.append(sv("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: "gridline" }));
    axis.append(sv("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, invert ? "#" + v : fmtInt(v)));
  }
  const xt = t1 === t0 ? 0 : Math.max(1, Math.min(4, Math.floor((W - m.l - m.r) / 75)));
  for (let i = 0; i <= xt; i++) {
    const t = t0 + (t1 - t0) * i / xt;
    axis.append(sv("text", { x: x(t), y: H - 4, "text-anchor": xt === 0 ? "middle" : i === 0 ? "start" : i === xt ? "end" : "middle" },
      (t1 - t0) > 2 * 86400 ? new Date(t * 1000).toLocaleDateString("de-DE", { timeZone: TZ, day: "2-digit", month: "2-digit" }) : fmtClock(t)));
  }
  svg.append(axis);
  // Step line (a value holds until the next snapshot); gaps (e.g. rank outside the top 100) break it. The area
  // runs toward the better side (up for ranks), so more fill is always better. Ranks get Top 10/25/50 bands.
  const runs = []; let cur = null;
  for (const p of points) { if (p.v == null) { cur = null; continue; } if (!cur) runs.push(cur = []); cur.push(p); }
  const base = invert ? m.t : H - m.b;
  const gid = "g" + Math.random().toString(36).slice(2, 7);
  const grad = sv("linearGradient", { id: gid, x1: 0, x2: 0, y1: invert ? 1 : 0, y2: invert ? 0 : 1 });
  grad.append(sv("stop", { offset: "0%", "stop-color": "var(--series-1)", "stop-opacity": ".34" }),
    sv("stop", { offset: "100%", "stop-color": "var(--series-1)", "stop-opacity": "0" }));
  const defs = sv("defs"); defs.append(grad); svg.append(defs);
  if (invert) {
    [[1, 10, "Top 10", .07], [10, 25, "Top 25", .11], [25, 50, "Top 50", .07]].forEach(([from, to, name, opacity]) => {
      const ya = y(Math.max(lo, from)), yb = y(Math.min(hi, to));
      if (to < lo || from > hi || yb <= ya) return;
      svg.insertBefore(sv("rect", { x: m.l, y: ya, width: W - m.l - m.r, height: yb - ya, class: "band", opacity }), axis);
      svg.append(sv("text", { x: m.l + 8, y: ya + 14, class: "bandlabel" }, name));
    });
  }
  let d = "", area = "";
  for (const run of runs) {
    let seg = "";
    run.forEach((p, i) => { const px = x(p.t).toFixed(1), py = y(p.v).toFixed(1); seg += i === 0 ? `M${px},${py}` : `H${px}V${py}`; });
    d += seg;
    area += `${seg}L${x(run[run.length - 1].t).toFixed(1)},${base}L${x(run[0].t).toFixed(1)},${base}Z`;
  }
  svg.append(sv("path", { d: area, fill: `url(#${gid})` }));
  svg.append(sv("path", { d, class: "line" }));
  const last = pts[pts.length - 1];
  svg.append(sv("circle", { cx: x(last.t), cy: y(last.v), r: 9, class: "halo" }));
  svg.append(sv("circle", { cx: x(last.t), cy: y(last.v), r: 4.5, class: "end" }));
  const endLabel = endText, pillW = endLabel.length * 7.6 + 12;
  svg.append(sv("rect", { x: x(last.t) + 12, y: y(last.v) - 11, width: pillW, height: 22, rx: 11, class: "pill" }));
  svg.append(sv("text", { x: x(last.t) + 18, y: y(last.v) + 4, class: "endlabel" }, endLabel));

  const hair = sv("line", { y1: m.t, y2: H - m.b, class: "hair", visibility: "hidden" });
  const dot = sv("circle", { r: 4, class: "end", visibility: "hidden" });
  const hit = sv("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" });
  svg.append(hair, dot, hit);
  const tip = el("div", { class: "tip" });
  box.append(tip);
  hit.addEventListener("pointermove", (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let best = points[0];
    for (const p of points) if (Math.abs(x(p.t) - px) < Math.abs(x(best.t) - px)) best = p;
    const cx = x(best.t);
    hair.setAttribute("x1", cx); hair.setAttribute("x2", cx); hair.setAttribute("visibility", "visible");
    if (best.v != null) { dot.setAttribute("cx", cx); dot.setAttribute("cy", y(best.v)); dot.setAttribute("visibility", "visible"); }
    else dot.setAttribute("visibility", "hidden");
    tip.replaceChildren(el("strong", {}, best.v == null ? missing : (invert ? "#" + best.v : fmt(best.v))),
      el("span", { class: "key" }), el("span", { class: "muted" }, `${label} | ${fmtTime(best.t)}`));
    tip.style.display = "block";
    const left = cx * r.width / W;
    tip.style.left = Math.min(Math.max(0, left - tip.offsetWidth / 2), r.width - tip.offsetWidth) + "px";
    tip.style.top = "-6px";
  });
  hit.addEventListener("pointerleave", () => { hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
}
function chartCard(title, series, opts) {
  const box = el("div", { class: "chart" });
  requestAnimationFrame(() => lineChart(box, series.map(([t, v]) => ({ t, v })), { label: title, ...opts }));
  return card(title, box);
}

function viewRanks(s, sub) {
  const scroll = (title, cols, rows) => [card(title, el("div", { class: "scroll" }, table(cols, rows)))];
  const valueBoard = (title, label, rows, fmt = fmtInt) => scroll(title, [
    { label: "#", num: true, get: (r) => r.rank },
    { label: "Spieler", get: playerLink },
    { label: "Gilde", get: (r) => r.guild || "-" },
    { label: label, num: true, get: (r) => fmt(r.value) },
    { label: "24 h", num: true, get: (r) => delta(r.value_day) },
  ], rows);
  if (sub === "silber") return valueBoard("Rangliste Silber (Top 100)", "Silber", s.silver);
  if (sub === "errungenschaften") return valueBoard("Rangliste Errungenschaften (Top 100)", "Errungenschaften", s.achievements);
  if (sub === "quests") return valueBoard("Rangliste Quests (Top 100)", "Quests", s.quests);
  if (sub === "aufsteiger") {
    let span = "day";
    const riserBox = el("div");
    const renderRisers = () => {
      const rows = s.risers[span];
      riserBox.replaceChildren(rows.length ? table([
        { label: "Spieler", get: playerLink },
        { label: "Gilde", get: (r) => r.guild || "-" },
        { label: "Ausrüstungswert", num: true, get: (r) => fmtInt(r.gear) },
        { label: span === "day" ? "24 Stunden" : "7 Tage", num: true, get: (r) => delta(r[span]) },
      ], rows) : el("p", { class: "note" }, span === "day" ? "Aufsteiger gibt es nach einem Tag Datensammlung." : "Aufsteiger der Woche gibt es nach sieben Tagen Datensammlung."));
    };
    renderRisers();
    return [el("section", { class: "card" }, el("div", { class: "head" }, el("h2", {}, "Aufsteiger (Ausrüstungswert)"),
      seg([["day", "24 Stunden"], ["week", "7 Tage"]], span, (k) => { span = k; renderRisers(); })), riserBox)];
  }
  return [
    ...scroll("Rangliste Ausrüstungswert (Top 100)", [
      { label: "#", num: true, get: (r) => r.rank },
      { label: "", title: "Plätze seit gestern", get: (r) => r.rank_change ? delta(r.rank_change) : "" },
      { label: "Spieler", get: playerLink },
      { label: "Gilde", get: (r) => r.guild || "-" },
      { label: "Ausrüstungswert", num: true, get: (r) => fmtInt(r.gear) },
      { label: "24 h", num: true, title: "Änderung des Ausrüstungswerts", get: (r) => delta(r.day) },
      { label: "Pro Tag", num: true, title: "Ausrüstungswert, Durchschnitt der letzten 7 Tage", get: (r) => r.pace == null ? "-" : fmtDec(r.pace) },
      { label: "ATK", num: true, get: (r) => fmtInt(r.atk) },
      { label: "DEF", num: true, get: (r) => fmtInt(r.def) },
      { label: "SUP", num: true, get: (r) => fmtInt(r.sup) },
    ], s.board),
  ];
}

function gearCard(slots, power) {

function fightCard(st) {
  const bars = el("div", { class: "bars" });
  for (const [, name, nKey, wKey] of FIGHT_KINDS) {
    const rate = st[nKey] ? 100 * st[wKey] / st[nKey] : null;
    bars.append(el("div", { class: "bar", style: "grid-template-columns:150px 1fr 60px" },
      el("span", {}, `${name} (${fmtInt(st[wKey])} von ${fmtInt(st[nKey])})`),
      el("div", { class: "track" }, rate == null ? null : el("div", { class: "fill", style: `width:${rate}%` })),
      el("span", { class: "val" }, pct(st[wKey], st[nKey]))));
  }
  return card("Kämpfe: Siegquote", bars, el("p", { class: "note" }, `Gefallen in ${pct(st.fallen, st.fights)} der Kämpfe, ${fmtInt(st.damage / Math.max(1, st.fights))} Schaden pro Kampf, höchste Bossstufe ${fmtInt(st.highestBossLevel)}.`));
}

  const charts = [];

  if (p.series.silver.length) charts.push(chartCard("Silber", p.series.silver, { fmt: fmtSilver, until: s.generated }));
  if (charts.length) out.push(el("div", { class: "grid two" }, ...charts));

  if (p.watch) {
    const st = p.watch.stats || {};
    out.push(el("h2", { class: "divider" }, "Beobachtungsliste und Top 100"));
    out.push(el("div", { class: "grid two" }, fightCard(st),
      card("Statistik", el("dl", { class: "facts" },
        el("dt", {}, "Schadensminderung"), el("dd", {}, `${fmtInt(p.watch.survival)} %, Leben ${fmtInt(p.watch.life)}`),
        STAT_ROWS.flatMap(([name, fn]) => [el("dt", {}, name), el("dd", {}, fn(st))])))));
    if (p.watch.slots && Object.keys(p.watch.slots).length) out.push(gearCard(p.watch.slots, p.power));
  } else {
    out.push(card("Mehr Statistik", el("p", { class: "note" }, "Ausrüstung je Platz und Kampfquoten gibt es für die Top 100 (einmal am Tag aktualisiert) und für Spieler auf der ",
      el("a", { href: WATCH_FORM }, "Beobachtungsliste"), " (bei jedem Lauf). Eintragen geht über ein kurzes Formular auf GitHub, nur für den eigenen Namen.")));
  }
  return out;
}

// ---- guild buildings and bosses ----
const BUILDING_ORDER = ["WERKSTATT", "LAGER", "KONTOR", "FELDKASSE", "AKADEMIE", "ARCHIV", "HANDELSPOSTEN", "HOCHOFEN", "WALL"];
const bossShort = (name) => name.replace(/^(Die|Der|Das|Verteidigung der) /, "").split(" ")[0];
function bossNames(guilds) {
  const names = [];
  for (const g of guilds) for (const n of Object.keys(g.bosses || {})) if (!names.includes(n)) names.push(n);
  return names;
}
function buildingsOf(g) {
  const b = g.buildings || {};
  const row = (k) => ({ key: k, label: b[k][2], level: b[k][0], max: b[k][1], effect: b[k][3], next: b[k][4], nextEffect: b[k][5], blocker: b[k][6], upkeep: b[k][7], until: b[k][8] });
  return BUILDING_ORDER.filter((k) => b[k]).map(row).concat(Object.keys(b).filter((k) => !BUILDING_ORDER.includes(k)).map(row));
}
function buildingsCard(g) {
  const rows = buildingsOf(g);
  if (!rows.length) return null;
  const full = (r) => r.level >= r.max;
  return card("Gebäude", el("div", { class: "wide-table" }, table([
    { label: "Gebäude", get: (r) => r.label },
    { label: "Stufe", num: true, get: (r) => `${fmtInt(r.level)} / ${fmtInt(r.max)}` },
    { label: "Wirkung", get: (r) => r.effect },
    { label: "Nächste Stufe bringt", get: (r) => full(r) ? "-" : r.nextEffect || "-" },
    { label: "Kosten", num: true, get: (r) => full(r) ? "voll ausgebaut" : fmtSilver(r.next) },
    ...(rows.some((r) => r.upkeep) ? [{ label: "Unterhalt", num: true, get: (r) => r.upkeep ? fmtSilver(r.upkeep) : "-" }] : []),
    ...(rows.some((r) => r.until && Date.parse(r.until) > Date.now())
      ? [{ label: "Bau", get: (r) => r.until && Date.parse(r.until) > Date.now() ? `fertig ${fmtTime(Date.parse(r.until) / 1000)}` : "-" }] : []),
    { label: "Gesperrt", get: (r) => full(r) || !r.blocker ? "-" : r.blocker }], rows)),
  el("p", { class: "note" }, "Gebaut wird aus der Gildenkasse; der Unterhalt läuft laufend weiter. Die Preise der nächsten Stufe zeigt das Spiel. Die Schmiede wirkt nur bis zum letzten Boss, den die Gilde der Reihe nach besiegt hat."));
}
function bossesCard(g) {
  const rows = Object.entries(g.bosses || {}).map(([name, v]) => ({ name, won: v[0], price: v[1], rec: v[2] }));
  if (!rows.length) return null;
  return card("Gildenbosse", table([
    { label: "Boss", get: (r) => r.name },
    { label: "Höchste Stufe besiegt", num: true, get: (r) => fmtInt(r.won) },
    { label: "Beschwören", num: true, get: (r) => fmtSilver(r.price) },
    { label: "Empfohlene Ausrüstung", num: true, get: (r) => fmtInt(r.rec) }], rows),
  el("p", { class: "note" }, `Ø Ausrüstung der Gilde: ${fmtInt(g.boss_gear)}. Preis und Empfehlung gelten für die nächste Stufe.`));
}

function progressCard(ranked) {
  const names = bossNames(ranked);
  if (!names.length && !ranked.some((g) => g.buildings)) return null;
  const cols = [{ label: "Gilde", get: (g) => el("a", { href: `#/gilden/${g.login}` }, g.name) }]
    .concat(BUILDING_ORDER.map((k) => {
      const label = (ranked.map(buildingsOf).flat().find((b) => b.key === k) || { label: k }).label;
      return { label, num: true, title: "Stufe", get: (g) => { const b = buildingsOf(g).find((x) => x.key === k); return b ? `${b.level} / ${b.max}` : "-"; } };
    }))
    .concat(names.map((n) => ({ label: bossShort(n), num: true, title: `${n}: höchste besiegte Stufe`, get: (g) => g.bosses && g.bosses[n] ? fmtInt(g.bosses[n][0]) : "-" })));
  return card("Gebäude und Gildenbosse", table(cols, ranked),
    el("p", { class: "note" }, "Gebäude: Stufe von höchstens 5 (der Hochofen 1). Bosse: höchste besiegte Stufe der Gilde. Einzelheiten stehen auf der Seite jeder Gilde."));
}

function viewGuildRace(s) {
  const per = (g, v) => v == null || !g.members ? null : v / g.members;
  const cols = [
    { label: "Gilde", get: (g) => el("a", { href: `#/gilden/${g.login}` }, g.name) },
    { label: "Mitglieder", num: true, get: (g) => `${fmtInt(g.members)} (${fmtInt(g.active)} aktiv)` },
    { label: "Ø Ausrüstungswert", num: true, title: "Durchschnitt der aktiven Mitglieder", get: (g) => fmtDec(g.avg_gear, 1) },
    { label: "24 h", num: true, title: "Kampfkraft der ganzen Gilde", get: (g) => delta(g.day) },
    { label: "7 Tage", num: true, title: "Kampfkraft der ganzen Gilde", get: (g) => delta(g.week) },
    { label: "7 Tage je Mitglied", num: true, get: (g) => delta(per(g, g.week), 1) },
    { label: "Kasse", num: true, get: (g) => fmtSilver(g.treasury) },
    { label: "Kasse 7 Tage", num: true, get: (g) => g.treasury_week == null ? "-" : el("span", { class: g.treasury_week >= 0 ? "up" : "down" }, signed(g.treasury_week) + " Silber") },
    { label: "Gespendet", num: true, get: (g) => fmtSilver(g.donated) },
    { label: "Bosse", num: true, title: "Siege / Niederlagen", get: (g) => `${fmtInt(g.boss_wins)} / ${fmtInt(g.boss_losses)}` },
  ];
  // Small guilds would top every average, so they only count from 10 active members and stand last in the table.
  const big = (g) => g.active >= 10;
  const ranked = [...s.guilds].sort((x, y) => (big(y) - big(x)) || ((y.avg_gear || 0) - (x.avg_gear || 0)));
  const bigOnes = ranked.filter(big);
  const top = (key) => bigOnes.reduce((a, g) => (!a || (g[key] ?? -Infinity) > (a[key] ?? -Infinity) ? g : a), null);
  const strongest = top("avg_gear"), largest = top("members"), richest = top("treasury");
  const climber = bigOnes.filter((g) => g.day != null).reduce((a, g) => (!a || per(g, g.day) > per(a, a.day) ? g : a), null);
  return [el("section", { class: "grid" },
    el("div", { class: "head" }, el("h1", {}, "Gilden im Vergleich")),
    el("div", { class: "grid tiles" },
      tile("Höchster Ø Ausrüstungswert", strongest ? strongest.login : "-", strongest ? `${fmtDec(strongest.avg_gear, 1)} je aktivem Mitglied` : ""),
      tile("Meiste Mitglieder", largest ? largest.login : "-", largest ? `${fmtInt(largest.members)}, davon ${fmtInt(largest.active)} aktiv` : ""),
      tile("Schnellster Aufstieg", climber ? climber.login : "-", climber ? `${signed(per(climber, climber.day), 1)} je Mitglied in 24 Stunden` : "nach einem Tag Verlauf"),
      tile("Größte Kasse", richest ? richest.login : "-", richest ? fmtSilver(richest.treasury) : "")),
    card("Alle Gilden nach Ø Ausrüstungswert", el("div", { class: "scroll" }, table(cols, ranked)),
      el("p", { class: "note" }, "Der Durchschnitt zählt nur aktive Mitglieder. Gilden mit weniger als 10 aktiven Mitgliedern stehen unten und gewinnen oben keine Kachel.")),
    progressCard(ranked), firstKillsCard(s))];
}

// The guilds' first kills (the game's list: per boss and level the guild that got there first).
function firstKillsCard(s, login) {
  let rows = (s.first_kills || []).filter((r) => r[2] && (!login || r[2] === login));

  return card("Erste Siege über die Bosse", el("div", { class: "scroll" }, table(cols, rows)),

}

// ---- search ----
let players = null, picked = 0;
async function suggest() {
  const q = $("q").value.trim().toLowerCase(), box = $("suggest");
  if (!q) { box.hidden = true; return; }
  try { players = players || await load("players.json"); } catch { return; }
  const hits = players.filter((p) => p[0].includes(q) || p[1].toLowerCase().includes(q))
    .sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || b[2] - a[2]).slice(0, 12);
  picked = 0;
  box.replaceChildren(...hits.map((p, i) => el("a", { href: `#/spieler/${p[0]}`, class: i === 0 ? "on" : null },
    el("span", {}, p[1]), el("span", { class: "muted" }, `${fmtInt(p[2])} | ${p[3] || "keine Gilde"}`))));
  if (!hits.length) box.append(el("div", { class: "note", style: "padding:6px 10px;margin:0" }, "Nicht erfasst"));
  box.hidden = false;
}
$("q").addEventListener("input", suggest);
$("q").addEventListener("keydown", (ev) => {
  const links = [...$("suggest").querySelectorAll("a")];
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    picked = (picked + (ev.key === "ArrowDown" ? 1 : links.length - 1)) % Math.max(1, links.length);
    links.forEach((a, i) => a.classList.toggle("on", i === picked));
  } else if (ev.key === "Enter" && links[picked]) location.hash = links[picked].getAttribute("href");
  else if (ev.key === "Escape") $("suggest").hidden = true;
});
document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) $("suggest").hidden = true; });

      { label: "Empfohlene Ausrüstung", num: true, get: (r) => fmtInt(r.recommendedGear) },
      { label: "Besonderes Beutestück", get: (r) => r.hoard.length ? r.hoard.map((h) => `${h.name} (${h.slot})`).join(", ") : "-" }], c.bosses),
      el("p", { class: "note" }, "Beute ist die Ausrüstungsstufe der Stücke, die ein Boss fallen lässt. Seit dem Update vom 04.10.2026 gibt es keinen Mythic-Modus mehr, jeder Boss hat eine Stufe nach der anderen.")),
    el("div", { class: "grid two" },
      card("Abenteuer und Überfälle", table([
        { label: "Name", get: (r) => r.name }, { label: "Art", get: (r) => r.kindLabel },
        { label: "Schwierigkeit", num: true, get: (r) => r.difficulty }], c.fights)),
      card("Gildenprojekte", table([
        { label: "Projekt", get: (r) => r.label }, { label: "Wirkung", get: (r) => r.description }], c.projects))),
    ...workshopCards(c),
    ((c.workshop || {}).wares || []).length ? null : card("Tränke und Verpflegung", el("div", { class: "scroll" }, table([
      { label: "Name", get: (r) => r.label }, { label: "Wirkung", get: (r) => r.description },
      { label: "Wirkt auf", get: (r) => POTION_USE[r.use] || r.use }], c.potions))))];
}

// The game's changelog (read from its page once a day) and the rule changes the collector measured, by day.
const berlinDay = (t) => new Date(t * 1000).toLocaleDateString("sv-SE", { timeZone: TZ });
async function viewChanges(s) {
  let changelog = [];
  try { changelog = await load("changelog.json"); } catch { /* an old build has none */ }
  const days = new Map();
  const day = (k) => days.get(k) || days.set(k, { entries: [], rules: [] }).get(k);
  for (const e of changelog) { const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(e.date || ""); if (m) day(`${m[3]}-${m[2]}-${m[1]}`).entries.push(e); }
  for (const r of s.rules.log) day(berlinDay(r[0])).rules.push(r);
  const keys = [...days.keys()].sort().reverse();
  const heading = (k) => k.split("-").reverse().join(".");
  const entry = (e, open) => el("details", open ? { open: "" } : {}, el("summary", {}, el("b", {}, e.title || "Änderung")),
    (e.groups || []).flatMap((g) => [el("h4", {}, g.title), el("ul", {}, (g.items || []).map((i) => el("li", {}, i)))]));
  const rule = (r) => el("div", { class: "rule" }, `${fmtClock(r[0])} Uhr, Regel gemessen: ${ruleName(r[1])} ${ruleText(r[1], r[2])} -> ${ruleText(r[1], r[3])}`);
  const intro = el("p", { class: "note" }, "Das Änderungsprotokoll des Spiels, einmal am Tag von seiner Seite gelesen, und dazwischen die Regeln, die sich beim Abfragen geändert haben (oft ohne Eintrag). ",
    gameLink("/changelog", "Im Spiel"), ". ", s.rules.since ? `Regeln werden seit ${fmtSince(s.rules.since)} bei jedem Lauf geprüft.` : "Die Regeln werden gerade erst gesammelt.");
  if (!keys.length) return [card("Änderungen", intro, el("p", { class: "note" }, s.rules.since ? "Seit Beginn der Aufzeichnung hat sich keine Regel geändert." : ""))];
  return [card("Änderungen", intro, el("div", { class: "log" }, keys.flatMap((k, i) => [el("h3", {}, heading(k)),
    ...days.get(k).entries.map((e, j) => entry(e, i === 0 && j === 0)), ...days.get(k).rules.map(rule)])))];
}

// Item forms (the name suffix fixes how a piece splits its points). Observed 09.10.2026: worn gear of the watched
// players and the market board, only pieces without plus or stone whose total fits the tier; [suffix, tier seen, atk,
// def, sup]. Tier null: never seen, the share comes from the original sheet (percent).
const FORMS = {"armor": [["Angriff", [["des Schlächters", 9, 36, 12, 0], ["des Berserkers", 9, 31, 17, 0], ["des Jägers", 9, 29, 12, 7], ["des Duellanten", 8, 24, 15, 4], ["des Kriegspriesters", 8, 22, 9, 12]]], ["Verteidigung", [["der Festung", 9, 7, 41, 0], ["des Bollwerks", 9, 5, 36, 7], ["des Wächters", 9, 12, 36, 0], ["des Tempelritters", 9, 2, 31, 15], ["des Veteranen", 9, 10, 31, 7]]], ["Unterstützung", [["des Pilgers", 8, 0, 15, 28], ["des Erzmagiers", 9, 12, 7, 29], ["des Kreuzritters", 9, 7, 14, 27], ["des Paladins", 9, 0, 22, 26], ["des Hospitaliters", 9, 5, 19, 24]]]], "w1": [["Angriff", [["des Schlächters", 9, 46, 2, 0], ["des Ritters", 8, 37, 6, 0], ["des Prinzen", null, 80.56, 19.44, 0], ["des Kriegspriesters", 9, 38, 5, 5], ["des Schildbrechers", 8, 32, 11, 0], ["des Sonnenordens", 8, 30, 6, 7]]]], "w2": [["Angriff", [["des Zerstörers", 9, 91, 5, 0], ["des Kriegsherrn", 7, 65, 11, 0], ["des Inquisitors", 3, 29, 4, 3], ["des Bergfrieds", 8, 64, 22, 0], ["der Morgenröte", 9, 67, 14, 15]]], ["Unterstützung", [["des Lichts", 9, 14, 14, 68], ["des Sturms", 5, 14, 3, 39], ["der Heilung", 9, 10, 24, 62], ["des Zorns", 3, 7, 7, 22], ["der Wacht", 6, 3, 23, 40]]]], "ring": [["Angriff", [["des Zorns", 9, 16, 5, 6], ["des Sturms", 8, 12, 2, 10]]], ["Verteidigung", [["des Schutzes", 9, 5, 16, 6]]], ["Unterstützung", [["des Segens", 9, 5, 5, 17], ["des Paladins", 8, 2, 10, 12]]]], "shield": [["Verteidigung", [["Turmschild", 7, 2, 36, 0], ["Tempelschild", 9, 0, 41, 7], ["Rundschild", 9, 7, 41, 0], ["Wappenschild", 10, 5, 40, 8], ["Kampfschild", 8, 11, 32, 0]]]]};

const FORM_ORIENT = { Angriff: "atk", Verteidigung: "def", Unterstützung: "sup" };
function formsCard(title, groups, note) {
  const shares = (r) => { const t = r[1] ? r[2] + r[3] + r[4] : 100; return [r[2], r[3], r[4]].map((v) => 100 * v / t); };
  const rows = groups.flatMap(([orient, list]) => [
    el("tr", { class: `group ${FORM_ORIENT[orient]}` }, el("td", { colspan: "6" }, orient)),
    ...list.map((r) => {
      const sh = shares(r), main = ["atk", "def", "sup"].indexOf(FORM_ORIENT[orient]);
      const seen = r[1] ? `Stufe ${r[1]}: ${r[2]}/${r[3]}/${r[4]}` : "nicht gesehen";
      return el("tr", {},
        el("td", {}, `... ${r[0]}`, el("span", { class: r[1] ? "seen" : "seen unseen" }, seen)),
        el("td", { class: "mix" }, el("div", { class: "mixbar", title: sh.map((v) => `${fmtDec(v, 0)} %`).join(" / ") },
          ...["atk", "def", "sup"].map((k, i) => el("span", { class: k, style: `width:${sh[i]}%` })))),
        ...sh.map((v, i) => el("td", { class: i === main ? "num main" : "num" }, `${fmtDec(v, 0)} %`)),
        el("td", { class: r[1] ? "num seen-col" : "num seen-col unseen" }, seen));
    })]);
  return card(title, el("div", { class: "wide-table" }, el("table", { class: "forms" },
    el("thead", {}, el("tr", {}, el("th", {}, "Form"), el("th", { class: "mix" }, "Verteilung"), el("th", { class: "num" }, "ATK"),
      el("th", { class: "num" }, "DEF"), el("th", { class: "num" }, "SUP"), el("th", { class: "num seen-col" }, "Gesehen"))),
    el("tbody", {}, rows))), note ? el("p", { class: "note" }, note) : null);
}
function viewForms() {
  return [el("section", { class: "grid" },
    el("div", { class: "head" }, el("h1", {}, "Ausrüstungsformen")),
    el("p", { class: "note" }, "Seit dem 28.09.2026 gibt es jedes Stück je Platz, Stufe und Ausrichtung in fünf Formen. Die Form steht im Namen (\"... des Schlächters\") und legt fest, wie sich die Punkte auf Angriff, Verteidigung und Unterstützung verteilen. Die Summe hängt nur von der Stufe ab: 5 je Stufe plus 3 (Stufe 9: 48), Zweihänder und Stäbe das Doppelte, Ringe 3 je Stufe (Stufe 9: 27)."),
    el("div", { class: "grid two" },
      el("div", { class: "grid forms-col", style: "grid-template-rows: auto 1fr" },
        formsCard("Rüstung", FORMS.armor, "Helm, Brustpanzer, Handschuhe, Beinschutz und Stiefel teilen sich die Formen."),
        formsCard("Ringe", FORMS.ring)),
      el("div", { class: "grid forms-col", style: "grid-template-rows: auto auto 1fr" },
        formsCard("Einhandwaffen", FORMS.w1),
        formsCard("Zweihandwaffen und Stäbe", FORMS.w2),
        formsCard("Schilde", FORMS.shield, "Bei Schilden steht der Typ vorne im Namen (\"kobaltener Turmschild\")."))),
    card("So ist die Tabelle entstanden", el("p", { class: "note" },
      "Nach einer Übersicht von fireworker2000 (Discord). Nachgeprüft am 09.10.2026 an der Ausrüstung der beobachteten Spieler und an rund 840 Angeboten auf dem Markt: gezählt nur Stücke ohne Verbesserung (+) und ohne Stein, deren Summe genau zur Stufe passt. Die Anteile stammen jeweils von der höchsten gesehenen Stufe, meist 9; auf niedrigen Stufen verschiebt die Rundung sie um mehrere Punkte (ein Ring des Zorns hat auf Stufe 2 4/1/1, auf Stufe 9 16/5/6). Bossbeute und Stücke mit eigenem Namen haben eigene Werte und fehlen hier. Waffen mit Verteidigung als Hauptwert gibt es nicht. \"des Prinzen\" war in den Daten nicht zu finden, seine Anteile stammen aus der Vorlage. Alle Angaben ohne Gewähr.")))];
}

async function viewGame(s, sub) {
  if (sub === "kompendium") return viewCompendium(s);
  if (sub === "formen") return viewForms();
  if (sub === "regeln") {
    const now = s.rules.now;
    if (!Object.keys(now).length) return [card("Regeln des Spiels", el("p", { class: "note" }, "Die Regeln werden gerade erst gesammelt."))];
    const known = new Set(RULE_GROUPS.flatMap(([, rows]) => rows.map((r) => r[0])));
    const groups = RULE_GROUPS.map(([title, rows]) => [title, rows.map((r) => r[0]).filter((k) => k in now)]).filter(([, keys]) => keys.length);
    const other = Object.keys(now).filter((k) => !known.has(k));
    if (other.length) groups.push(["Sonstiges", other]);
    return [card("Die Regeln des Spiels", el("p", { class: "note" },
        "Das sind die Zahlen, mit denen das Spiel gerade rechnet, so wie es sie selbst veröffentlicht. Sie ändern sich ab und zu, oft ohne Ankündigung; ",
        el("a", { href: "#/spiel/aenderungen" }, "unter Änderungen"), " steht, was sich wann geändert hat.")),
      el("div", { class: "grid two" }, groups.map(([title, keys]) => card(title, el("dl", { class: "rules" },
        keys.filter((k) => k in now).flatMap((k) => [
          el("dt", {}, ruleName(k)),
          el("dd", {}, el("b", {}, ruleText(k, now[k])), (RULE_INFO[k] || {}).help ? el("span", { class: "muted" }, (RULE_INFO[k] || {}).help) : null)])))))];
  }
  if (sub === "aenderungen") return viewChanges(s);
  const e = s.economy, now = e.series[e.series.length - 1];
  const treasury = e.series.map((p) => [p.t, p.treasury]);
  const top = e.series.filter((p) => p.top100 != null).map((p) => [p.t, p.top100]);
  return [el("section", { class: "grid" },
    el("div", { class: "head" }, el("h1", {}, "Wirtschaft")),
    el("div", { class: "grid tiles" },
      tile("In den Gildenkassen", now ? fmtSilver(now.treasury) : "-", `${fmtInt(s.guilds.length)} Gilden`),
      tile("Silber der Top 100", now && now.top100 != null ? fmtSilver(now.top100) : "-", "reichste 100 Spieler"),
      tile("Mittel der Top 100", e.median_top100 == null ? "-" : fmtSilver(e.median_top100), "Silber je Spieler (Median)"),
      tile("Gespendet insgesamt", fmtSilver(s.guilds.reduce((n, g) => n + (g.donated || 0), 0)), "in allen Gilden")),
    el("div", { class: "grid two" },
      chartCard("Silber in den Gildenkassen", treasury, { fmt: fmtSilver, until: s.generated }),
      chartCard("Silber der heutigen Top 100", top, { fmt: fmtSilver, until: s.generated })),
    el("p", { class: "note" }, "Der Markt und seine Preise sind im Spiel nur mit Anmeldung sichtbar und fehlen deshalb hier. Gezählt wird, was Gilden und Bestenliste öffentlich zeigen."))];
}

// ---- routing ----
// Each section has sub pages (one per ranking, guild or fight table), shown as a second tab row.
const SECTIONS = {
  start: { subs: () => [], render: viewStart },
  rangliste: { subs: () => [["kampfkraft", "Ausrüstungswert"], ["silber", "Silber"], ["errungenschaften", "Errungenschaften"],
                            ["quests", "Quests"], ["aufsteiger", "Aufsteiger"]], render: viewRanks },
  gilden: { subs: (s) => [["vergleich", "Vergleich"], ...s.guilds.map((g) => [g.login, g.login])], render: viewGuild },
  spiel: { subs: () => [["wirtschaft", "Wirtschaft"], ["regeln", "Regeln"], ["aenderungen", "Änderungen"], ["kompendium", "Kompendium"],
                         ["formen", "Formen"]],
           render: viewGame },
  kaempfe: { subs: () => [["arten", "Kampfarten"], ["abenteuer", "Abenteuer"], ["ueberleben", "Überleben"], ["kraft", "Kampfkraft"],
                          ["zeit", "Wann und wo"], ["gilden", "Gilden"], ["letzte", "Letzte Kämpfe"]],
             render: viewFights },
};
async function route() {
  $("suggest").hidden = true; $("q").value = "";
  const [, name, arg] = location.hash.split("/");
  const view = name === "spieler" ? "player" : SECTIONS[name] ? name : "start";
  for (const a of document.querySelectorAll("header .tabs a")) a.toggleAttribute("aria-current", a.dataset.view === view);
  let s;
  try { s = await load("summary.json"); }
  catch { $("view").replaceChildren(card("Keine Daten", el("p", { class: "note" }, "Die Daten konnten nicht geladen werden."))); return; }
  const login = decodeURIComponent(arg || "").toLowerCase();
  let parts;
  if (view === "player") {
    $("subtabs").hidden = true;
    parts = await viewPlayer(s, login);
  } else {
    const subs = SECTIONS[view].subs(s);
    const sub = (subs.find(([key]) => key === login) || subs[0] || [])[0];
    $("subtabs").replaceChildren(...subs.map(([key, label]) =>
      el("a", { href: `#/${view}/${key}`, ...(key === sub ? { "aria-current": "page" } : {}) }, label)));
    $("subtabs").hidden = subs.length < 2;
    parts = await SECTIONS[view].render(s, sub);
  }
  // The search box lives in the header, on the start page it moves into the page.
  const search = document.querySelector(".search"), header = document.querySelector("header");
  if (view !== "start" && search.parentNode !== header) header.insertBefore(search, header.querySelector(".tabs"));
  $("view").replaceChildren(...parts.filter(Boolean));
  if (view === "start") $("hero-search").replaceWith(search);
  document.title = view === "player" ? `${login} | Chat-RPG Statistik` : "Chat-RPG Statistik";
  const ld = s.load;
  const requests = ld && ld.per_run ? `, zusammen etwa ${fmtInt(ld.per_run * ld.runs_per_day)} Anfragen am Tag: ${fmtInt(ld.per_run)} pro Lauf, ${fmtInt(ld.runs_per_day)} Läufe` : "";
  $("footer").replaceChildren(`Stand ${fmtTime(s.generated)}${s.since ? `, Daten seit ${fmtSince(s.since)}` : ""}. Liest nur öffentliche Daten von `,
    el("a", { href: "https://rpg.sola.rip" }, "rpg.sola.rip"),
    ` (etwa alle 15 Minuten von 7 bis 24 Uhr, ohne Anmeldung${requests}). Kein offizielles Angebot des Spiels. Fast komplett vibe-coded (von einer KI geschrieben, nur stichprobenartig geprüft), die Zahlen sind Schätzungen. `,
    el("a", { href: `https://github.com/${REPO}` }, "Quellcode und Beobachtungsliste"), ". Im Spiel: ",
    gameLink("/kampf", "Kämpfe"), ", ", gameLink("/bestenliste", "Bestenliste"), ", ", gameLink("/gilden", "Gilden"), ", ",
    gameLink("/markt", "Markt"), ", ", gameLink("/kanaele", "Kanäle"), ".");
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
