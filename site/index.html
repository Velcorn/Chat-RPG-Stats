async function viewMyAbspann(s, sub, login) {
  let p;
  try { p = await load(`p/${encodeURIComponent(login)}.json`); }
  catch { return [card("Nicht gefunden", el("p", { class: "note" }, `"${login}" ist nicht erfasst. `, el("a", { href: "#/saison/abspann" }, "Zum großen Abspann")))]; }
  if (REDUCED_MOTION || !p.series.gear.length) { location.replace(`#/spieler/${encodeURIComponent(login)}`); return []; }
  let tl = null;
  try { tl = await load("timelapse.json"); } catch { /* no comparison with the field */ }
  const ctx = { tl, summary: s };
  const list = [["title", 6, (d) => abMeTitle(d)], ["way", 22, (d, x) => abMeWay(d, x)],
    ...(tl && tl.groups.length ? [["field", 22, (d, x) => abMeField(d, x)]] : []),
    ...(p.series.rank.filter((x) => x[1] >= 1).length > 1 ? [["rank", 20, (d, x) => abMeRank(d, x)]] : []),
    ...(p.split && p.split.atk != null ? [["build", 12, (d) => abMeBuild(d)]] : []),
    ...(p.series.silver.length > 4 ? [["silver", 18, (d, x) => abMeSilver(d, x)]] : []),
    ["end", Infinity, (d, x) => abMeEnd(d, x)]];
  const stage = abPlayer({ data: p, ctx, list, exit: `#/spieler/${encodeURIComponent(login)}`,
    poster: { kick: "Dein Abspann", title: p.name, sub: "Deine Saison, nur mit deinen Zahlen", back: "Zurück zum Profil" } });
  return [el("section", { class: "grid" }, stage)];
}

// The player: steps through `list` ([id, seconds, make(data, ctx)]), `poster` is the start screen, `exit` the hash Esc goes to.
function abPlayer({ data, ctx, list, poster: pst, exit }) {
  const stage = el("div", { class: "ab-stage" }), host = el("div", { class: "ab-host" });
  const bar = el("div", { class: "ab-prog" }, el("i", {})), label = el("span", { class: "ab-label" });
  const playBtn = el("button", { class: "ab-ctl", "aria-label": "Pause" }, "❚❚");
  const SPEEDS = [0.5, 1, 2, 4];
  const speeds = SPEEDS.map((x) => el("button", { class: "ab-ctl sp", onclick: () => { speed = x; paint(); } }, `${x === 0.5 ? "½" : x}×`));
  const autoBtn = el("button", { class: "ab-ctl auto", title: "Am Ende eines Kapitels automatisch weiter (A)", onclick: () => { auto = !auto; paint(); } }, "Auto weiter");
  const prev = el("button", { class: "ab-ctl", "aria-label": "Vorheriges Kapitel", onclick: () => go(idx - 1) }, "⏮");
  const next = el("button", { class: "ab-ctl", "aria-label": "Nächstes Kapitel", onclick: () => go(idx + 1) }, "⏭");
  const ctl = el("div", { class: "ab-ctls" }, prev, playBtn, next, ...speeds, autoBtn, label, bar);
  const poster = el("div", { class: "ab-poster" }, el("div", { class: "ab-kick" }, pst.kick), el("h1", { class: "ab-title" }, pst.title),
    el("p", { class: "ab-sub" }, pst.sub),
    el("button", { class: "ab-btn", onclick: () => start(0) }, "▶ Abspann abspielen"),
    el("p", { class: "ab-note" }, "Leertaste: Pause · Pfeiltasten: Kapitel · 5, 1, 2, 4: Tempo · A: nicht automatisch weiter · Esc: zur Seite"),
    el("a", { class: "ab-link", href: exit }, pst.back));
  stage.append(poster);
  let idx = 0, t = 0, playing = false, speed = 1, auto = true, cur = null, last = 0, raf = 0;
  const paint = () => {
    playBtn.textContent = playing ? "❚❚" : "▶";
    playBtn.setAttribute("aria-label", playing ? "Pause" : "Weiter");
    speeds.forEach((b, k) => b.classList.toggle("on", SPEEDS[k] === speed));
    autoBtn.classList.toggle("on", auto);
    autoBtn.setAttribute("aria-pressed", String(auto));
    label.textContent = `${idx + 1} / ${list.length}`;
  };
  function go(i, frac = 0) {
    idx = Math.max(0, Math.min(list.length - 1, i)); t = frac * (list[idx][1] === Infinity ? 0 : list[idx][1]);
    const [, , make] = list[idx];
    cur = make(data, ctx);
    host.replaceChildren(cur.node); cur.node.classList.add("in");
    cur.update(frac); paint();
  }
  function tick(now) {
    if (!stage.isConnected) return;
    const dt = Math.min(0.2, (now - last) / 1000); last = now;
    if (playing) {
      const dur = list[idx][1];
      t += dt * speed;
      if (t >= dur && idx < list.length - 1 && auto) go(idx + 1);
      else { if (t >= dur && idx < list.length - 1) label.textContent = `${idx + 1} / ${list.length} - weiter mit der Pfeiltaste rechts`; cur.update(clamp01(t / dur)); bar.firstChild.style.width = `${(100 * (idx + clamp01(t / (dur === Infinity ? 1 : dur))) / list.length).toFixed(2)}%`; }
    }
    raf = requestAnimationFrame(tick);
  }
  function start(from = 0, frac = 0) {
    poster.remove(); stage.append(host, ctl); playing = true; go(from, frac);
    last = performance.now(); raf = requestAnimationFrame(tick);
  }
  playBtn.addEventListener("click", () => { playing = !playing; paint(); });
  const keys = (e) => {
    if (!stage.isConnected) { document.removeEventListener("keydown", keys); cancelAnimationFrame(raf); return; }
    if (!host.isConnected || e.target.matches?.("input, textarea, select")) return;
    if (e.key === " ") { playing = !playing; paint(); e.preventDefault(); }
    else if (e.key === "ArrowRight") go(idx + 1);
    else if (e.key === "ArrowLeft") go(idx - 1);
    else if (["1", "2", "4"].includes(e.key)) { speed = +e.key; paint(); }
    else if (e.key === "5") { speed = 0.5; paint(); }
    else if (e.key === "a" || e.key === "A") { auto = !auto; paint(); }
    else if (e.key === "Escape") location.hash = exit;
  };
  document.addEventListener("keydown", keys);
  // ?kapitel=race (or race:0.5 for halfway in) starts the film at that chapter; the ids are the first entries of AB_SCENES
  const [wantedId, wantedAt] = (new URLSearchParams(location.search).get("kapitel") || "").split(":");
  const wanted = list.findIndex(([id]) => id === wantedId);
  if (wanted >= 0) requestAnimationFrame(() => start(wanted, +wantedAt || 0));
  ctx.restart = () => go(0);
  return stage;
}


async function viewAbspann(s) {
  if (!s.abspann || !s.finale?.top || REDUCED_MOTION) return viewSeason(s);
  let top = null, tl = null;
  try { top = await load("toplapse.json"); } catch { /* the race scene is left out */ }
  try { tl = await load("timelapse.json"); } catch { /* the capsule shows no hurdle */ }
  const ctx = { top, tl, summary: s };
  const list = AB_SCENES.filter(([id]) => (id !== "race" && id !== "capsule") || (top && top.frames.length > 1))
    .filter(([id]) => id !== "overtakes" || s.abspann.overtakes)
    .filter(([id]) => id !== "growth" || s.abspann.growth.gains.length)
    .filter(([id]) => id !== "guilds" || s.abspann.guilds.length)
    .filter(([id]) => id !== "builds" || s.abspann.builds.length > 1);
  const stage = abPlayer({ data: s, ctx, list, exit: "#/saison/seite",
    poster: { kick: "Das Spiel ist gewonnen", title: "Chat-RPG", sub: "Der Abspann unserer Messungen", back: "Lieber als Seite lesen" } });
  return [el("section", { class: "grid" }, stage)];
}

// ---- routing ----
// Each section has sub pages (one per ranking, guild or fight table), shown as a second tab row.
const SECTIONS = {
  changelog: { subs: () => [], render: viewSiteChanges },
  abspann: { subs: () => [], render: viewMyAbspann },
  saison: { subs: (d) => d.abspann ? [["abspann", "Abspann"], ["seite", "Als Seite lesen"]] : [], render: (d, sub) => sub === "seite" ? viewSeason(d) : viewAbspann(d) },
  start: { subs: () => [], render: viewStart },
  rangliste: { subs: () => [["ausruestungswert", "Ausrüstungswert"], ["kampfkraft", "Kampfkraft"], ["aufsteiger", "Aufsteiger"], ["zeitraffer", "Zeitraffer"]],
               render: viewRanks },
  gilden: { subs: (s) => [["vergleich", "Vergleich"], ["zeitraffer", "Zeitraffer"], ...s.guilds.map((g) => [g.login, g.name || g.login])], render: viewGuild,
            dropdown: true },
  spiel: { subs: () => [["regeln", "Regeln"], ["hoechstwerte", "Höchstwerte"], ["formen", "Formen"], ["spezial", "Spezialitems"], ["verbessern", "Verbessern"]],
           alias: { aenderungen: "regeln", ausruestung: "hoechstwerte", maximum: "hoechstwerte" }, render: viewGame },
  kaempfe: { subs: () => [["uebersicht", "Übersicht"], ["kraft", "Kampfkraft"], ["auszahlung", "Auszahlung"], ["beute", "Beute"], ["letzte", "Letzte Kämpfe"]],
             render: viewFights },
};
async function initSeasons() {
  try { SEASONS = await loadBase("seasons.json"); } catch { /* first build before the season index exists */ }
  const pick = $("season");
  pick.replaceChildren(el("option", { value: "live" }, SEASONS.current?.label || "Aktuelle Saison"),
    el("option", { value: "report" }, "Aktueller Saisonbericht"),
    ...SEASONS.archives.map((s) => el("option", { value: `archive:${s.id}` }, s.label)));
  pick.addEventListener("change", () => {
    if (pick.value.startsWith("archive:")) {
      location.href = `${location.pathname}?s=${encodeURIComponent(pick.value.slice(8))}#/saison`;
    } else {
      location.href = `${location.pathname}${pick.value === "report" ? "#/saison" : "#/start"}`;
    }
  });
}

async function route() {
  $("suggest").hidden = true; $("q").value = "";
  const [, name, arg] = location.hash.split("/");
  const view = name === "spieler" ? "player" : SECTIONS[name] ? name : "start";
  $("season").value = SEASON_ID ? `archive:${SEASON_ID}` : view === "saison" || view === "abspann" ? "report" : "live";
  for (const a of document.querySelectorAll("header .tabs a")) a.toggleAttribute("aria-current", a.dataset.view === view);
  let s;
  try { s = await load("summary.json"); }
  catch { $("view").replaceChildren(card("Keine Daten", el("p", { class: "note" }, "Die Daten konnten nicht geladen werden."))); return; }
  const login = decodeURIComponent(arg || "").toLowerCase();
  let parts;
  if (view === "player") {
    $("subtabs").hidden = true;
    parts = await viewPlayer(s, login);
  } else {
    const subs = SECTIONS[view].subs(s);
    const sub = (subs.find(([key]) => key === (SECTIONS[view].alias || {})[login] || key === login) || subs[0] || [])[0];
    if (SECTIONS[view].dropdown) {  // many entries (the guilds, more to come): one dropdown instead of a row of tabs
      const pick = el("select", { class: "cmp pick", "aria-label": "Auswahl" },
        ...subs.map(([key, label]) => el("option", { value: key, ...(key === sub ? { selected: "" } : {}) }, label)));
      pick.addEventListener("change", () => { location.hash = `#/${view}/${pick.value}`; });
      $("subtabs").replaceChildren(pick);
    } else {
      $("subtabs").replaceChildren(...subs.map(([key, label]) =>
        el("a", { href: `#/${view}/${key}`, ...(key === sub ? { "aria-current": "page" } : {}) }, label)));
    }
    $("subtabs").hidden = subs.length < 2;
    parts = await SECTIONS[view].render(s, sub, login);
  }
  // The search box lives in the header, on the start page it moves into the page.
  const search = document.querySelector(".search"), header = document.querySelector("header");
  if (view !== "start" && search.parentNode !== header) header.insertBefore(search, header.querySelector(".tabs"));
  $("view").replaceChildren(...parts.filter(Boolean));
  if (view === "start") $("hero-search").replaceWith(search);
  $("repo-link").href = `https://github.com/${REPO}`;
  $("ver").textContent = [s.version ? `v${s.version}` : "", `Stand ${fmtTime(s.generated)}`].filter(Boolean).join(" | ");
  document.title = view === "player" ? `${login} | Chat-RPG Statistik`
    : view === "saison" ? `${s.season?.label || "Saisonbericht"} | Chat-RPG Statistik` : "Chat-RPG Statistik";
  const ld = s.load;
  const requests = ld && ld.per_run ? `, zusammen etwa ${fmtInt(ld.per_run * ld.runs_per_day)} Anfragen am Tag: ${fmtInt(ld.per_run)} pro Lauf, ${fmtInt(ld.runs_per_day)} Läufe` : "";
  $("footer").replaceChildren(`${s.season?.archived ? "Archivstand" : "Stand"} ${fmtTime(s.generated)}${s.since ? `, Daten seit ${fmtSince(s.since)}` : ""}. Liest nur öffentliche Daten von `,
    el("a", { href: "https://rpg.sola.rip" }, "rpg.sola.rip"),
    ` (etwa alle 5 Minuten, von 1 bis 9 Uhr alle 15, ohne Anmeldung${requests}). Kein offizielles Angebot des Spiels. Fast komplett vibe-coded (von einer KI geschrieben, nur stichprobenartig geprüft), die Zahlen sind Schätzungen. `,
    el("a", { href: `https://github.com/${REPO}` }, "Quellcode und Beobachtungsliste"), ". ",
    el("a", { href: "#/changelog" }, "Änderungen der Seite"), ". Im Spiel: ",
    gameLink("/kampf", "Kämpfe"), ", ", gameLink("/bestenliste", "Bestenliste"), ", ", gameLink("/gilden", "Gilden"), ", ",
    gameLink("/markt", "Markt"), ", ", gameLink("/kanaele", "Kanäle"), ".");
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
initSeasons().then(route);
</script>
<div id="tapTip" hidden></div>
</body>
</html>
