<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat-RPG Statistik</title>
<meta name="description" content="Ranglisten, Verlauf und Prognosen für das Twitch-Chat-RPG rpg.sola.rip">
<style>
  @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/Inter-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/Inter-Bold.woff2") format("woff2"); }

  :root {
    color-scheme: dark;
    --page: #131312;
    --surface-1: #1a1a19;
    --surface-2: #262624;
    --border: #383835;
    --grid: #2c2c2a;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-2: #d99a1c;
    --accent: #3987e5;
    --good: #2fae6d;
    --warning: #d99a1c;
    --critical: #e5534b;
    --atk: #e5534b;
    --def: #3987e5;
    --sup: #2fae6d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: radial-gradient(ellipse at top left, #18222d 0, transparent 55%), var(--page); color: var(--text-primary);
         font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1440px; margin: 0 auto; padding: 24px clamp(12px, 3vw, 20px); display: grid; gap: 20px; }
  .ver { margin-left: 8px; font-size: 11px; font-weight: 400; color: var(--text-muted); white-space: nowrap; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-bottom: 16px;
           border-bottom: 1px solid var(--border); }
  header .tabs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .season-pick { max-width: 190px; padding: 8px 10px; color: var(--text-primary); background: var(--surface-2);
                 border: 1px solid var(--border); border-radius: 8px; }
  .tabs a { color: var(--text-secondary); text-decoration: none; padding: 8px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface-2); }
  .tabs a:hover { border-color: var(--text-muted); }
  .tabs a[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--text-primary); }
  .sub { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .sub a { padding: 3px 10px; font-size: 13px; background: none; border-color: transparent; }
  .sub a[aria-current] { background: var(--surface-2); border-color: var(--border); color: var(--text-primary); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h1 a { color: inherit; text-decoration: none; }
  h2 { font-size: 12px; margin: 0 0 16px; padding-left: 10px; border-left: 3px solid #619de0;
       font-weight: 600; color: #bdd6ed; text-transform: uppercase; letter-spacing: .09em; }
  a { color: var(--accent); }
  .muted { color: var(--text-muted); }
  .secondary { color: var(--text-secondary); }
  .card { background: #1a1e20; border: 1px solid #343a3d; border-radius: 14px; padding: 20px; min-width: 0;
          box-shadow: 0 8px 24px #0002; }
  .grid { display: grid; gap: 16px; min-width: 0; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .two { grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); }
  .tile { container-type: inline-size; padding: 18px 20px; background: linear-gradient(130deg, #203345, #1a2028); border-color: #405467; }
  .tile .label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                 overflow-wrap: anywhere; hyphens: auto; }
  .tile.kk { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-content: start; }
  .tile.kk .sub { grid-column: 1 / -1; }
  .season-podium { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 700px) { .season-podium { grid-template-columns: minmax(0, 1fr); } }
  .season-podium .tile .label { font-weight: 650; }
  .season-podium .podium-1 { border-color: #d4af37; background: linear-gradient(130deg, #4a3d12, #1a2028); }
  .season-podium .podium-1 .label { color: #e6c653; }
  .season-podium .podium-2 { border-color: #aab4bf; background: linear-gradient(130deg, #343b43, #1a2028); }
  .season-podium .podium-2 .label { color: #c5cdd5; }
  .season-podium .podium-3 { border-color: #b87333; background: linear-gradient(130deg, #44301d, #1a2028); }
  .season-podium .podium-3 .label { color: #d08c4f; }
  @media (min-width: 701px) { .season-podium .podium-2 { order: 1; } .season-podium .podium-1 { order: 2; } .season-podium .podium-3 { order: 3; }
    .season-podium .podium-1 { padding-top: 28px; padding-bottom: 28px; } }
  .tile .pwl { text-transform: none; letter-spacing: 0; }
  .tile .sub a { padding: 0; font-size: inherit; }
  .tile .pwv { align-self: start; margin-top: 8px; font-size: 13px; font-weight: 650; line-height: 1.2; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .tile .value { font-size: min(40px, 14cqw); font-weight: 650; font-variant-numeric: tabular-nums; margin: 8px 0; white-space: nowrap; }
  .tile .sub { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { .tile .value { font-size: min(32px, 14cqw); } .tile .pwv { font-size: 10px; margin-top: 6px; } .tile.kk { grid-column: 1 / -1; } }
  input, button { font: inherit; color: var(--text-primary); background: var(--surface-2);
                  border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  button { cursor: pointer; } button:hover { border-color: var(--text-muted); }
  .seg { display: inline-flex; gap: 4px; }
  .seg button { padding: 2px 10px; font-size: 12px; }
  .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); }
  h2.divider { margin: 6px 0 -4px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .head.start { justify-content: flex-start; gap: 12px; }
  .card > .head { margin-bottom: 8px; }
  .head h2 { margin: 0; }
  .streams { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .stream .head { margin-bottom: 4px; }
  .stream .lines { display: grid; gap: 2px; margin: 8px 0; }
  .stream .lines div { display: flex; justify-content: space-between; gap: 8px; }
  .key-card { background: linear-gradient(135deg, #211f2b, #18252d); border-color: #4e4962; }
  .key-card > .head { align-items: flex-start; }
  .key-finish { text-align: right; color: var(--text-secondary); }
  .key-finish strong { display: block; color: #fff; font-size: 17px; }
  @media (max-width: 760px) { .key-finish { text-align: left; } }
  h3 { font-size: 13px; margin: 14px 0 0; font-weight: 600; }
  .era { margin-bottom: 4px; }
  h2.section { font-size: 15px; margin: 10px 0 0; color: var(--text-secondary); }
  .rules { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 14px; margin: 0; }
  .rules dt { color: var(--text-secondary); }
  .rules dd { margin: 0; display: grid; gap: 1px; }
  .rules dd .muted { font-size: 12px; }
  @media (max-width: 600px) { .rules { grid-template-columns: 1fr; } .rules dd { margin-bottom: 6px; } }
  .pill { padding: 1px 9px; border-radius: 10px; font-size: 12px; border: 1px solid var(--border); color: var(--text-muted); }
  .pill.on { background: var(--good); border-color: var(--good); color: #fff; }
  .search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
  .search input { width: 100%; }
  .card .search { max-width: none; }
  .suggest { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 5; background: var(--surface-2);
             border: 1px solid var(--border); border-radius: 6px; max-height: 320px; overflow: auto; }
  .suggest a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; color: var(--text-primary);
               text-decoration: none; }
  .suggest a:hover, .suggest a.on { background: var(--surface-1); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  tbody tr:nth-child(even) { background: #ffffff04; }
  tbody tr:hover { background: #ffffff05; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface-1); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td a { color: var(--text-primary); text-decoration: none; } td a:hover { text-decoration: underline; }
  .scroll { max-height: 520px; overflow: auto; }
  /* A table wider than its card scrolls sideways; the shadows at the edges show that there is more (they only appear
     where something is hidden), and the main column stays in view. */
  .wide-table { overflow-x: auto;
    background: linear-gradient(to right, var(--surface-1) 30%, transparent) left / 28px 100% no-repeat local,
                linear-gradient(to left, var(--surface-1) 30%, transparent) right / 28px 100% no-repeat local,
                radial-gradient(farthest-side at 0 50%, rgba(255, 255, 255, .16), transparent) left / 12px 100% no-repeat scroll,
                radial-gradient(farthest-side at 100% 50%, rgba(255, 255, 255, .16), transparent) right / 12px 100% no-repeat scroll; }
  th .st { display: none; }
  .wide-table .stick { position: sticky; left: 0; background: var(--surface-1); z-index: 1; }
  @media (max-width: 600px) {
    main { gap: 14px; padding-top: 16px; }
    .card { padding: 14px; border-radius: 12px; }
    table { font-size: 13px; }
    th, td { padding: 5px; }
    th.num { white-space: normal; }  /* long headings wrap instead of widening their column */
    .hide-sm { display: none; }
    th .lg { display: none; } th .st { display: inline; }
    .hero .hv .pwv { font-size: 20px; }
    /* `cards`: every row a small card, all columns, instead of a table that scrolls sideways. */
    table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; }
    table.cards thead { display: none; }
    table.cards tr { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--surface-2); }
    table.cards td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 2px 0; text-align: right; }
    table.cards td::before { content: attr(data-label); color: var(--text-secondary); text-align: left; flex: none; }
    table.cards td:first-child { justify-content: flex-start; font-weight: 600; font-size: 14px; padding-bottom: 4px; text-align: left; }
    table.cards td:first-child::before { content: none; }
    table.cards td.hide-sm { display: flex; }
    table.cards .stick { position: static; background: none; }
    .wide-table:has(table.cards) { background: none; }
    .scroll:has(table.cards) { max-height: none; overflow: visible; }
    /* The five sections as a bar at the bottom, where the thumb is. */
    header .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; margin: 0; gap: 6px; flex-wrap: nowrap;
                   padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--surface-1);
                   border-top: 1px solid var(--border); }
    header .tabs a { flex: 1 1 0; text-align: center; padding: 8px 2px; white-space: nowrap; }
    body { padding-bottom: 64px; }
    .sub { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .sub a { flex: 0 0 auto; padding: 3px 8px; }
  }
  .up { color: var(--good); } .down { color: var(--critical); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2);
         border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; margin-left: 6px; }
  .bars { display: grid; gap: 6px; margin: 12px 0 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(110px, 220px) 1fr 48px; gap: 10px; align-items: center; font-size: 13px; }
  .bar-label { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--grid); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; border-radius: 4px; }
  .bar-value { text-align: right; font-variant-numeric: tabular-nums; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart .axis text { fill: var(--text-muted); font-size: 11px; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 5; }
  .chart .line { fill: none; stroke: var(--series-1); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .chart .end { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
  .chart .halo { fill: var(--series-1); opacity: .22; }
  .chart .pill { fill: var(--series-1); }
  .chart .endlabel { fill: #fff; font-size: 12px; font-weight: 700; }
  .chart .band { fill: var(--series-1); }
  .chart .bandlabel { fill: var(--text-muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .chart .hair { stroke: var(--text-muted); stroke-width: 1; }
  .chart .empty { fill: var(--text-muted); font-size: 13px; }
  .chart.redchart svg { height: 140px; }
  .redfacts { margin-top: 10px; } .redfacts + .chart { margin-top: 2px; }
  details.fold > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .08em; list-style: none; }
  details.fold > summary::before { content: "+ "; color: var(--text-muted); } details.fold[open] > summary::before { content: "- "; }
  details.fold[open] > summary { margin-bottom: 10px; }
  .rolebar { display: grid; grid-template-columns: 64px minmax(0, 1fr) 76px; gap: 10px; align-items: center; margin: 8px 0; font-size: 13px; }
  .rolebar .rtrack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; }
  .rolebar .rseg { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; min-width: 4px; }
  .rseg.atk, .rkey.atk { background: var(--atk); } .rseg.def, .rkey.def { background: var(--def); } .rseg.sup, .rkey.sup { background: var(--sup); }
  .rolebar .rn { text-align: right; font-size: 12px; }
  .legend .rkey { width: 10px; height: 10px; border-radius: 2px; }
  @media (max-width: 640px) { .rolebar { grid-template-columns: 52px minmax(0, 1fr); } .rolebar .rn { display: none; } }
  .chart svg { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .chart .glow { fill: none; stroke: var(--series-1); stroke-width: 7; opacity: .28; }
  .chart .line2 { fill: none; stroke: var(--series-2); stroke-width: 2; stroke-dasharray: 6 4; stroke-linejoin: round; }
  .chart .end2 { fill: var(--series-2); stroke: var(--surface-1); stroke-width: 2; }
  .chart .sel { fill: var(--series-1); opacity: .16; stroke: var(--series-1); stroke-opacity: .6; }
  .chart .hit { cursor: crosshair; }
  .chart .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s ease-out forwards; }
  .chart .fadein { animation: fade 1s ease-out both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; } }
  .chart .bin { fill: color-mix(in srgb, var(--series-1) 55%, transparent); } .chart .bin:hover { fill: var(--series-1); }
  .chart .bin.hot { fill: var(--series-2); }
  .chart .mark { stroke-width: 2; } .chart .mark.me { stroke: var(--series-2); } .chart .mark.ref { stroke: var(--text-muted); stroke-dasharray: 4 3; }
  .chart .marklabel { font-size: 11px; font-weight: 650; fill: var(--text-secondary); } .chart .marklabel.me { fill: var(--series-2); }
  .chart .tri { fill: color-mix(in srgb, var(--text-primary) 3%, transparent); stroke: var(--border); }
  .chart .corner { font-size: 12px; font-weight: 700; } .chart .corner.atk { fill: var(--atk); } .chart .corner.def { fill: var(--def); } .chart .corner.sup { fill: var(--sup); }
  .chart .dot { opacity: .22; } .chart .dot.atk { fill: var(--atk); } .chart .dot.def { fill: var(--def); } .chart .dot.sup { fill: var(--sup); }
  .chart .tme { fill: var(--text-primary); stroke: var(--page); stroke-width: 2; } .chart .me-halo { fill: none; stroke: var(--text-primary); stroke-width: 2; opacity: .6; }
  .tern-box svg { height: auto; max-width: 440px; margin: 0 auto; }
  .chart .dot.near { opacity: .95; }
  .chart .fit { stroke: var(--text-primary); }
  .chart .odot, .odot-key { stroke: var(--surface-1); stroke-width: 1.5; opacity: .9; }
  .b0 { fill: #3987e5; background: #3987e5; } .b1 { fill: #d99a1c; background: #d99a1c; } .b2 { fill: #2fae6d; background: #2fae6d; }
  .b3 { fill: #e5534b; background: #e5534b; } .b4 { fill: #a77de0; background: #a77de0; } .b5 { fill: #3fb8c4; background: #3fb8c4; }
  .lapse-ctl { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .lapse-ctl input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: var(--accent); }
  .tl-box { position: relative; overflow: hidden; }
  .tl-row { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px;
            text-decoration: none; will-change: transform, opacity; border-radius: 6px; }
  .tl-bar { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 6px; min-width: 6px;
            background: linear-gradient(90deg, hsl(var(--h) 45% 24% / .55), hsl(var(--h) 60% 42% / .75)); }
  .tl-box.following .tl-row:not(.follow) { filter: saturate(.45) brightness(.75); }
  .tl-row.follow { z-index: 2; outline: 2px solid hsl(var(--h) 90% 65%); background: hsl(var(--h) 45% 18% / .85); }
  .tl-row.lead .tl-bar { box-shadow: 0 0 10px hsl(var(--h) 80% 55% / .5); }
  .tl-rank { position: relative; width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .tl-name { position: relative; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
             font-weight: 600; color: hsl(var(--h) 80% 76%); }
  .tl-score { position: relative; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .speed { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .speed input { width: 90px; accent-color: var(--accent); }
  .speed-val { min-width: 3em; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .lapse-play { min-width: 92px; }
  .lapse-ctl + .legend, .lapse-ctl ~ .legend { font-variant-numeric: tabular-nums; }
  .lapse-when { min-width: 7.5em; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .legend i.ln { width: 16px; height: 0; border-radius: 0; border-top: 2px solid var(--series-2); background: none; }
  .legend i.ln.ref { border-top: 2px dashed var(--text-muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .chart .ci { opacity: .2; } .chart .ci.atk { fill: var(--atk); } .chart .ci.def { fill: var(--def); } .chart .ci.sup { fill: var(--sup); }
  .chart .fall { fill: none; stroke-width: 2.4; stroke-linejoin: round; } .chart .fall.atk { stroke: var(--atk); } .chart .fall.def { stroke: var(--def); } .chart .fall.sup { stroke: var(--sup); }
  .chart .fdot { stroke: var(--surface-1); stroke-width: 1.5; } .chart .fdot.atk { fill: var(--atk); } .chart .fdot.def { fill: var(--def); } .chart .fdot.sup { fill: var(--sup); }
  .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .chart-head h2 { margin: 0; }
  .chart-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  select.pick { font-size: 14px; padding: 6px 10px; max-width: 100%; }
  select.cmp, input.cmp { font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border); }
  input.cmp { width: 120px; }
  .tip .tipline { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .tip .key.k2 { background: var(--series-2); height: 0; border-top: 2px dashed var(--series-2); }

  /* Abspann: a dark stage the season plays on; gold only here */
  .ab-stage { position: relative; height: min(82vh, 700px); min-height: 520px; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
              border: 1px solid #343a3d; background: radial-gradient(ellipse at 50% 0%, #1b2030 0%, #0b0c12 70%); color: var(--text-primary); }
  .ab-stage:before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
                     background-image: radial-gradient(#fff6 1px, transparent 1px), radial-gradient(#fff4 1px, transparent 1px);
                     background-size: 90px 90px, 53px 53px; background-position: 0 0, 20px 30px; }
  .ab-host { position: relative; flex: 1; display: flex; padding: 22px clamp(12px, 3vw, 30px) 8px; min-width: 0; }
  .ab-scene { width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
  .ab-scene.in { animation: abIn .6s ease both; }

// What a player's gear line can be compared with: the top-100 border, place 1, the next place up, anyone.
function gearCompare(s, p, login) {
  const pts = (series) => series.map(([t, v]) => ({ t, v }));
  const of = async (other, name) => ({ name, points: pts((await load(`p/${encodeURIComponent(other)}.json`)).series.gear) });
  const out = [];
  if (s.top100.series && s.top100.series.length) out.push({ key: "border", label: "Grenze Top 100", load: async () => ({ name: "Platz 100", points: pts(s.top100.series) }) });
  const first = s.board[0];
  if (first && first.login !== login) out.push({ key: "first", label: "Platz 1", load: () => of(first.login, first.name) });
  out.push({ key: "next", label: "Nächster Platz", load: async () => {
    const ps = await load("players.json"), i = ps.findIndex((q) => q[0] === login);
    return i > 0 ? of(ps[i - 1][0], ps[i - 1][1]) : null;
  } });
  out.push({ key: "other", label: "Anderer Spieler", ask: true, load: async (name) => {
    const ps = await load("players.json"), q = ps.find((r) => r[0] === name || r[1].toLowerCase() === name);
    return q ? of(q[0], q[1]) : null;
  } });
  return out;
}

// Damage reduction as the game computes it: round(100 d / (d + 80)) for the defense d; each point adds less.
const reduction = (d) => 100 * d / (d + 80);
const gainPer10 = (d) => reduction(d + 10) - reduction(d);
function reductionCurve(box, def, survival) {
  box.replaceChildren();
  const W = Math.max(240, box.clientWidth), H = 140, m = { l: 36, r: 12, t: 8, b: 24 }, top = Math.max(500, Math.ceil((def + 60) / 100) * 100);
  const x = (d) => m.l + d / top * (W - m.l - m.r), y = (r) => m.t + (1 - r / 100) * (H - m.t - m.b);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Schadensminderung nach Verteidigung" });
  box.append(svg);
  const axis = sv("g", { class: "axis" });
  for (const r of [0, 25, 50, 75, 100]) axis.append(sv("line", { x1: m.l, x2: W - m.r, y1: y(r), y2: y(r), class: "gridline" }), sv("text", { x: m.l - 6, y: y(r) + 4, "text-anchor": "end" }, `${r} %`));
  for (let d = 0; d <= top; d += 100) axis.append(sv("text", { x: x(d), y: H - 8, "text-anchor": d === 0 ? "start" : d === top ? "end" : "middle" }, d));
  svg.append(axis);
  const pts = []; for (let d = 0; d <= top; d += top / 60) pts.push([d, reduction(d)]);
  svg.append(sv("path", { d: pts.map(([d, r], i) => `${i ? "L" : "M"}${x(d).toFixed(1)},${y(r).toFixed(1)}`).join(""), class: "line" }));
  svg.append(sv("line", { x1: x(def), x2: x(def), y1: y(reduction(def)), y2: H - m.b, class: "mark me" }), sv("line", { x1: m.l, x2: x(def), y1: y(reduction(def)), y2: y(reduction(def)), class: "mark me" }),
    sv("circle", { cx: x(def), cy: y(reduction(def)), r: 5, class: "tme" }),
    sv("text", { x: x(def) + 8, y: y(reduction(def)) + 18, class: "marklabel me" }, `DEF ${fmtInt(def)}: ${fmtInt(survival ?? Math.round(reduction(def)))} %`));
  svg.append(sv("text", { x: W - m.r, y: m.t + 4, "text-anchor": "end", class: "marklabel" }, "100 x DEF / (DEF + 80)"));
}
const perMember = (g, total) => g.members ? total / g.members : null;  // guild totals per member, so size alone doesn't win

// The guild tiles: averages per (active) member, so size alone doesn't win. Small guilds (under 10 active) don't count.
function guildTiles(s) {
  const bigOnes = s.guilds.filter((g) => g.active >= 10);
  const by = (f) => bigOnes.reduce((a, g) => (!a || (f(g) ?? -Infinity) > (f(a) ?? -Infinity) ? g : a), null);
  const strongest = by((g) => g.avg_gear), engaged = by((g) => g.members ? g.active / g.members : null),
    richest = by((g) => perMember(g, g.treasury)), giving = by((g) => perMember(g, g.donated));
  return el("div", { class: "grid tiles" },
    tile("Höchster Ø Ausrüstungswert", strongest ? strongest.login : "-", strongest ? `${fmtDec(strongest.avg_gear, 1)} je aktivem Mitglied` : ""),
    tile("Höchster Aktiven-Anteil", engaged ? engaged.login : "-", engaged ? `${pct(engaged.active, engaged.members)} der Mitglieder aktiv` : ""),
    tile("Größte Kasse je Mitglied", richest ? richest.login : "-", richest ? `${fmtSilver(perMember(richest, richest.treasury))} je Mitglied` : ""),

// Won boss fights by role and stat (since 0.27.0): per role a card with the role's own stat in steps of 20, the share
// that fell and what they did, each with a small bar. Steps with few fighters say little and stay out.
const STAT_MIN = 15, STAT_STEP = 20;
// Who falls depends on the defense, whatever the role: so every card shows the fall rate by defense, and under it what
// the role's own stat brings (what a tank takes, what a fighter deals, what a supporter boosts).
const STAT_ROLES = [
  { role: "TANK", title: "Schildträger", effect: ["def", "Verteidigung", "Ø eingesteckt", "def"] },
  { role: "FIGHTER", title: "Kämpfer", effect: ["atk", "Angriff", "Ø Schaden", "atk"] },
  { role: "SUPPORT", title: "Unterstützer", effect: ["sup", "Unterstützung", "Ø Verstärkung", "sup"] },
];
let statBoss = null;
function statRows(rows) {
  const out = new Map();  // the collector counts in steps of 10: two of them make one step here
  for (const [lo, n, fell, done] of rows) {
    const k = Math.floor(lo / STAT_STEP) * STAT_STEP, acc = out.get(k) || [0, 0, 0];
    acc[0] += n; acc[1] += n * (fell || 0) / 100; acc[2] += n * (done || 0);
    out.set(k, acc);
  }
  return [...out].sort((a, b) => a[0] - b[0]).filter(([, a]) => a[0] >= STAT_MIN)
    .map(([k, [n, fell, done]]) => ({ k, n, fell: 100 * fell / n, done: done / n }));
}
function roleCard(c, { role, title, effect }) {
  const by = (stat) => statRows(((c.roles[role] || {})[stat]) || []);
  const fall = by("def"), box = el("div", { class: "chart" });
  requestAnimationFrame(() => fallChart(box, fall, { color: "def", statName: "Verteidigung" }));
  const kids = [el("h2", {}, title),
    el("p", { class: "note" }, `Gefallen nach Verteidigung, ${fmtInt(fall.reduce((a, r) => a + r.n, 0))} Teilnahmen`), box];
  if (effect) {
    const [stat, statName, label, color] = effect, eff = by(stat), ebox = el("div", { class: "chart" });
    requestAnimationFrame(() => effectChart(ebox, eff, { color, statName, label }));
    kids.push(el("p", { class: "note" }, `${label} nach ${statName}`), ebox);
  }
  return el("section", { class: "card statrole" }, ...kids);
}
function statCurvesCard(s) {
  const curves = s.stat_curves || [];
  const intro = "Teilnehmer in Bosssiegen nach Rolle (ohne Namen, seit 11.10.2026).";
  if (!curves.length) return card("Werte und Überleben in Bosssiegen", el("p", { class: "note" }, intro + " Die ersten Zahlen erscheinen nach den nächsten Bosskämpfen."));
  if (!curves.some((c) => c.boss === statBoss)) statBoss = curves[0].boss;
  const box = el("div");
  const render = () => {
    const c = curves.find((x) => x.boss === statBoss);
    box.replaceChildren(el("div", { class: "grid three" }, ...STAT_ROLES.map((r) => roleCard(c, r))),

  };

}

// ---- what a fight pays: the silver per fighter, spread over the fights of a type ----
const PAYOUT_FEW = 5;  // fights a type needs to show in the table and chart
// One row per fight type: a dot per fight (the mean of those standing at the end), the mean as a bar, mean +- 1 std as a band.
function payoutChart(box, types) {
  box.replaceChildren();
  const W = Math.max(280, box.clientWidth), row = 26, m = { l: Math.min(170, Math.round(W * 0.4)), r: 12, t: 8, b: 26 };
  const H = m.t + m.b + row * types.length;
  const all = types.flatMap((t) => t.pts), lo = Math.min(0, ...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.03, bot = lo - pad, top = hi + pad, ticks = niceTicks(lo, hi, 5).filter((v) => v >= bot && v <= top);
  const x = (v) => m.l + (v - bot) / (top - bot || 1) * (W - m.l - m.r);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Silber je Kämpfer nach Kampf", style: `height:${H}px` });
  box.append(svg);
  const axis = sv("g", { class: "axis" });
  for (const v of ticks) axis.append(sv("line", { x1: x(v), x2: x(v), y1: m.t, y2: H - m.b, class: "gridline" }),
    sv("text", { x: x(v), y: H - 8, "text-anchor": "middle" }, fmtInt(v)));
  svg.append(axis);
  if (bot < 0) svg.append(sv("line", { x1: x(0), x2: x(0), y1: m.t, y2: H - m.b, class: "mark ref" }));
  const tip = el("div", { class: "tip" });
  box.append(tip);
  const short = (n) => { const t = n.replace(/^(Die|Das|Der|Verteidigung der) /, ""); return t.length > 24 ? `${t.slice(0, 23)}...` : t; };
  types.forEach((t, i) => {
    const cy = m.t + row * i + row / 2, col = t.kind === "BOSS" ? "var(--accent)" : "var(--warning)", a = t.alive;
    svg.append(sv("text", { x: m.l - 8, y: cy + 4, "text-anchor": "end", class: "marklabel" }, short(t.name)),
      sv("line", { x1: x(a.min), x2: x(a.max), y1: cy, y2: cy, style: `stroke:${col};opacity:.55;stroke-width:1` }),
      sv("rect", { x: x(a.mean - a.std), y: cy - 9, width: Math.max(2, x(a.mean + a.std) - x(a.mean - a.std)), height: 18, rx: 3, style: `fill:${col};opacity:.2` }));
    t.pts.forEach((v, j) => svg.append(sv("circle", { cx: x(v), cy: cy + ((j * 37) % 9 - 4) * 1.2, r: 2.6, style: `fill:${col};opacity:.75` })));
    svg.append(sv("line", { x1: x(a.mean), x2: x(a.mean), y1: cy - 10, y2: cy + 10, style: "stroke:var(--text-primary);stroke-width:2" }));
    const hit = sv("rect", { x: 0, y: cy - row / 2, width: W, height: row, fill: "transparent" });
    hit.addEventListener("pointerenter", () => {
      tip.replaceChildren(el("strong", {}, fightLabel(t)), el("span", { class: "muted" },
        `Ø ${fmtInt(a.mean)}, Std ${fmtDec(a.std)}, ${fmtInt(a.min)} bis ${fmtInt(a.max)} Silber (${count(t.n, "Kampf", "Kämpfe")})`));
      placeTip(tip, Math.min(W - 10, Math.max(10, x(a.mean))) * svg.getBoundingClientRect().width / W, svg.getBoundingClientRect().width);
    });
    hit.addEventListener("pointerleave", () => { tip.style.display = "none"; });
    svg.append(hit);
  });
}

// ---- search ----
let players = null, picked = 0;
async function suggest() {
  const q = $("q").value.trim().toLowerCase(), box = $("suggest");
  if (!q) { box.hidden = true; return; }
  try { players = players || await load("players.json"); } catch { return; }
  const hits = players.filter((p) => p[0].includes(q) || p[1].toLowerCase().includes(q))
    .sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || b[2] - a[2]).slice(0, 12);
  picked = 0;
  box.replaceChildren(...hits.map((p, i) => el("a", { href: `#/spieler/${p[0]}`, class: i === 0 ? "on" : null },
    el("span", {}, p[1]), el("span", { class: "muted" }, `${fmtInt(p[2])} | ${p[3] || "keine Gilde"}`))));
  if (!hits.length) box.append(el("div", { class: "note", style: "padding:6px 10px;margin:0" }, "Nicht erfasst"));
  box.hidden = false;
}
$("q").addEventListener("input", suggest);
$("q").addEventListener("keydown", (ev) => {
  const links = [...$("suggest").querySelectorAll("a")];
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    picked = (picked + (ev.key === "ArrowDown" ? 1 : links.length - 1)) % Math.max(1, links.length);
    links.forEach((a, i) => a.classList.toggle("on", i === picked));
  } else if (ev.key === "Enter" && links[picked]) location.hash = links[picked].getAttribute("href");
  else if (ev.key === "Escape") $("suggest").hidden = true;
});
document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) $("suggest").hidden = true; });

// ---- top 100 time lapse ----
// The gear board every two hours (toplapse.json), played as a race: every player has a colour of their own, the rows
// glide to their new place, the bars show the score. Until the evening of 04.10.2026 the board counted the Kampfkraft.
const BOARD_GEAR_SINCE = 1791151200;  // 2026-10-04 22:00 UTC, as GEAR_SINCE in build.py
async function viewTopLapse() {
  const head = el("div", { class: "head" }, el("h1", {}, "Zeitraffer Top 100"));
  let d = null;
  try { d = await load("toplapse.json"); } catch { /* none yet */ }
  if (!d || d.frames.length < 2) return [el("section", { class: "grid" }, head, el("p", { class: "note" }, "Noch nicht genug Daten für einen Zeitraffer."))];
  const F = d.frames.length, P = d.names.length;
  const rank = Array.from({ length: P }, () => new Uint8Array(F)), score = Array.from({ length: P }, () => new Int16Array(F));
  d.rows.forEach((row, k) => row.forEach(([i, sc], r) => { rank[i][k] = r + 1; score[i][k] = sc; }));
  const best = rank.map((r) => Math.min(...Array.from(r).filter(Boolean)));
  const hue = (i) => (i * 137.508) % 360;  // the golden angle: neighbours in the list get far apart colours
  let follow = null;  // the player index being followed
  let f = 0, playing = false, last = 0, speed = 1, N = 25, rows = [], lay = { cols: 1, rpc: 25, cw: 300, row: 28 };
  const status = el("div", { class: "legend" }), box = el("div", { class: "tl-box" }), when = el("strong", { class: "lapse-when" }), era = el("span", { class: "muted" }), lead = el("div", { class: "legend" });
  const play = el("button", { class: "lapse-play" }, "Abspielen");
  const slider = el("input", { type: "range", min: "0", max: String(F - 1), step: "0.01", value: "0", "aria-label": "Zeitpunkt" });
  // Up to 25 rows per column; 50 and 100 use more columns side by side so the whole race fits on one screen.
  const layout = () => {
    const width = Math.max(260, box.clientWidth || box.parentNode.clientWidth || 600), fit = Math.max(1, Math.floor(width / 250));
    const cols = Math.min(Math.ceil(N / 25), fit), rpc = Math.ceil(N / cols);
    lay = { cols, rpc, cw: width / cols, row: Math.max(20, Math.min(30, Math.floor((window.innerHeight - 300) / rpc))) };
  };
  const pick = el("input", { type: "search", class: "cmp pick", list: "tl-names", placeholder: "Spieler verfolgen", "aria-label": "Spieler verfolgen" });
  const names = el("datalist", { id: "tl-names" }, ...[...Array(P).keys()].sort((u, w) => d.names[u].localeCompare(d.names[w], "de")).map((i) => el("option", { value: d.names[i] })));
  pick.addEventListener("input", () => {
    const q = pick.value.trim().toLowerCase();
    const i = q ? d.names.findIndex((n, k) => n.toLowerCase() === q || d.logins[k] === q) : -1;
    follow = i < 0 ? null : i;
    draw();
  });
  const rebuild = () => {
    layout();
    const shown = [...Array(P).keys()].filter((i) => best[i] <= N);
    const top = Math.max(...shown.flatMap((i) => Array.from(score[i]).filter((v, k) => v && rank[i][k] <= N)));
    box.replaceChildren(); box.style.height = `${lay.rpc * lay.row}px`;
    rows = shown.map((i) => {
      const bar = el("span", { class: "tl-bar" }), rk = el("span", { class: "tl-rank" }), sc = el("span", { class: "tl-score" });
      const a = el("a", { class: "tl-row", href: `#/spieler/${encodeURIComponent(d.logins[i])}`,
        style: `--h:${hue(i).toFixed(0)};width:${lay.cw - 6}px;height:${lay.row}px` },
        bar, rk, el("span", { class: "tl-name" }, d.names[i]), sc);
      box.append(a);
      return { i, a, bar, rk, sc };
    });
    rows.top = top;
    draw();
  };
  const draw = () => {
    // Each step rests for a moment, glides, and rests again, so the places are readable between the moves.
    const ease = (x) => { const t = Math.max(0, Math.min(1, (x - 0.2) / 0.6)); return t * t * (3 - 2 * t); };
    const a = Math.floor(f), b = Math.min(F - 1, a + 1), at = Math.round(f);
    // The switch from Kampfkraft to gear score reshuffles everything: jump instead of gliding through a tangle.
    const w = d.frames[a] < BOARD_GEAR_SINCE && d.frames[b] >= BOARD_GEAR_SINCE ? (f - a >= 0.5 ? 1 : 0) : ease(f - a);
    let leader = null, lo = Infinity, hi = 0;
    const now = [];  // the scores on show, for a bar scale that starts below the lowest: the race stays visible
    for (const r of rows) {
      const ra = rank[r.i][a], rb = rank[r.i][b];
      const pa = ra ? ra - 1 : N + 1, pb = rb ? rb - 1 : N + 1, pos = pa + (pb - pa) * w;
      if (pos >= N) { r.a.style.display = "none"; continue; }
      // glide in x and y between the two places, so a row changing column slides across instead of jumping
      const xy = (q) => [Math.floor(q / lay.rpc) * lay.cw, (q % lay.rpc) * lay.row];
      // A row coming in or leaving rises from / sinks below its own column.
      const [xa, ya] = pa >= N ? [xy(pb)[0], lay.rpc * lay.row] : xy(pa), [xb, yb] = pb >= N ? [xa, lay.rpc * lay.row] : xy(pb);
      const px = xa + (xb - xa) * w, py = ya + (yb - ya) * w;
      const sa = score[r.i][a] || score[r.i][b], sb = score[r.i][b] || sa, sc = sa + (sb - sa) * w;
      r.a.style.display = "";
      r.a.style.transform = `translate(${px.toFixed(1)}px,${py.toFixed(1)}px)`;
      r.a.classList.toggle("lead", pos < 0.5);
      r.a.style.opacity = String(Math.max(0, Math.min(1, N - pos)));
      lo = Math.min(lo, sc); hi = Math.max(hi, sc); now.push([r, sc]);
      r.rk.textContent = String(w < 0.5 ? ra || rb : rb || ra);
      r.sc.textContent = fmtInt(sc);
      if (pos < 0.5) leader = r.i;
    }
    for (const [r, sc] of now) r.bar.style.width = `${(10 + 90 * (sc - lo * 0.97) / (hi - lo * 0.97 || 1)).toFixed(1)}%`;
    box.classList.toggle("following", follow != null);
    for (const r of rows) r.a.classList.toggle("follow", r.i === follow);
    if (follow == null) status.replaceChildren();
    else {
      const here = rank[follow][at], sc = score[follow][at];
      status.replaceChildren(el("strong", { style: `color:hsl(${hue(follow).toFixed(0)} 80% 76%)` }, d.names[follow]), here
        ? ` auf Platz ${here} mit ${fmtInt(sc)}${here > N ? " (außerhalb der Anzeige)" : ""}` : " in diesem Moment nicht in den Top 100",
        ` | beste Platzierung: ${best[follow]}`);
    }
    const t = d.frames[at], gear = t >= BOARD_GEAR_SINCE;
    when.textContent = fmtTime(t);
    era.textContent = gear ? "Ausrüstungswert" : "Kampfkraft (so ordnete das Spiel bis zum 05.10.2026)";
    lead.replaceChildren(leader == null ? "" : el("span", {}, "Platz 1: ", el("strong", { style: `color:hsl(${hue(leader).toFixed(0)} 90% 70%)` }, d.names[leader])));
    slider.value = String(f);
    play.textContent = playing ? "Anhalten" : f >= F - 1 ? "Von vorn" : "Abspielen";
  };
  const tick = (now) => {
    if (!playing || !box.isConnected) { playing = false; draw(); return; }
    f = Math.min(F - 1, f + (now - last) / 1000 * 1 * speed);
    last = now; draw();
    if (f >= F - 1) { playing = false; draw(); return; }
    requestAnimationFrame(tick);
  };
  play.addEventListener("click", () => {
    if (playing) { playing = false; draw(); return; }
    if (f >= F - 1) f = 0;
    playing = true; last = performance.now(); requestAnimationFrame(tick);
  });
  slider.addEventListener("input", () => { f = +slider.value; draw(); });
  requestAnimationFrame(() => {
    rebuild();
    let w = box.clientWidth;
    new ResizeObserver(() => { if (box.isConnected && Math.abs(box.clientWidth - w) > 4) { w = box.clientWidth; rebuild(); } }).observe(box);
  });
  return [el("section", { class: "grid" }, head,
    card("", el("div", { class: "lapse-ctl" }, play, slider, when,
        speedControl((v) => { speed = v; })),
      el("div", { class: "lapse-ctl" }, pick, names, seg([["10", "Top 10"], ["25", "Top 25"], ...(window.innerWidth >= 560 ? [["50", "Top 50"], ["100", "Top 100"]] : [])], "25", (k) => { N = +k; rebuild(); }), era), lead, status),
    card("", box, el("p", { class: "note" }, "Die Rangliste des Spiels alle zwei Stunden. Jeder Spieler hat seine eigene Farbe, ein Klick auf den Namen öffnet seine Seite. Spieler, die aus der Anzeige fallen oder nachrücken, gleiten von unten ein und aus.")))];
}

      { label: "Aktive", num: true, get: (g) => `${fmtInt(g.active)} von ${fmtInt(g.members)}` },
      { label: "Kasse je Mitglied", num: true, sm: false, get: (g) => fmtSilver(perMember(g, g.treasury)) },
      { label: "Gespendet je Mitglied", num: true, sm: false, get: (g) => fmtSilver(perMember(g, g.donated)) }],
      [...s.guilds].sort((x, y) => ((y.active >= 10) - (x.active >= 10)) || ((y.avg_gear || 0) - (x.avg_gear || 0))))),
      el("p", { class: "note" }, "Durchschnitte je (aktivem) Mitglied; Gilden unter 10 Aktiven stehen zuletzt und gewinnen nichts."))] : [];

  const cards = el("div", { class: "grid season-share" },
    seasonShareCard("Ranglistenkarte", leader ? `${leader.name} · #1` : "Noch offen",
      leader ? `${fmtInt(leader.gear)} Ausrüstungswert` : "Noch keine Rangliste",
      leader ? `${label}: ${leader.name} ${archived ? "beendet die Saison" : "steht aktuell"} auf Rang 1 mit ${fmtInt(leader.gear)} Ausrüstungswert.` : label),
    seasonShareCard("Bossjäger", count(total.wins, "Sieg", "Siege"), `${pct(total.wins, total.n)} der Kämpfe gewonnen`,
      `${label}: ${fmtInt(total.wins)} von ${fmtInt(total.n)} Kämpfen gewonnen.`),
    seasonShareCard("Stärkste Gilde", strongest ? strongest.name : "-",
      strongest ? `Ø ${fmtDec(strongest.avg_gear, 1)} Ausrüstungswert` : "Noch keine Gilde",
      strongest ? `${label}: ${strongest.name} führt mit Ø ${fmtDec(strongest.avg_gear, 1)} Ausrüstungswert.` : label));

  const chosen = getMe() || leader?.login;
  let journey = null;
  if (chosen) {
    try {
      const p = await load(`p/${encodeURIComponent(chosen)}.json`);
      journey = el("div", { class: "grid two" },
        chartCard(`Ausrüstungswert von ${p.name}`, p.series.gear, { until: s.generated }),
        chartCard(`Rang von ${p.name}`, p.series.rank, { invert: true, until: s.generated, empty: "noch nicht in den Top 100" }));
      if (getMe()) cards.prepend(seasonShareCard("Dein Abschluss", `${p.name} · #${fmtInt(p.forecast.rank)}`,
        `${fmtInt(p.gear)} Ausrüstungswert${p.guild ? ` · ${p.guild.name}` : ""}`,
        `${label}: ${p.name}, Rang ${fmtInt(p.forecast.rank)}, ${fmtInt(p.gear)} Ausrüstungswert.`));
    } catch { /* a player without an archived page: the global report still works */ }
  }

  const first = new Map();
  for (const row of [...(s.first_kills || [])].sort((a, b) => (a[4] || "").localeCompare(b[4] || ""))) {
    if (!first.has(row[0])) first.set(row[0], row);
  }
  const milestones = [...first.values()].slice(-8).reverse();
  const moments = milestones.length ? card("Saisonmomente", el("div", { class: "milestones" }, ...milestones.map((r) =>
    el("div", { class: "milestone" }, el("span", { class: "muted" }, r[4] ? fmtSince(iso(r[4])) : "-"),
      el("div", {}, el("strong", {}, `${r[3] || r[2]} besiegt ${r[0]} zuerst`),
        el("div", { class: "note" }, "Erster Gildensieg laut Spiel")))))) : null;

  const other = await comparisonSummary();
  const compare = other ? [el("div", { class: "head" }, el("h1", {}, `${label} im Vergleich mit ${other.label}`)),
    el("div", { class: "grid season-compare" },
      comparisonCard("Höchster Ausrüstungswert", leader?.gear, other.data.board[0]?.gear),
      comparisonCard("Aktive Spieler", s.active, other.data.active),
      comparisonCard("Gewonnene Kämpfe", total.wins, other.data.stats.total.wins))] : [];

  return [el("section", { class: "grid" }, intro, headline, ...stage, ...way, ...records, ...numbers, ...guildsEnd, moments,
    journey, el("div", { class: "head" }, el("h1", {}, "Zum Teilen")), cards, ...compare,
    card(archived ? "Finale Rangliste" : "Aktuelle Top 10", table([
      { label: "#", num: true, get: (r) => fmtInt(r.rank) },
      { label: "Spieler", get: playerLink },
      { label: "Ausrüstungswert", short: "AW", num: true, get: (r) => fmtInt(r.gear) },
      { label: "Gilde", sm: false, get: (r) => r.guild || "-" },
    ], s.board.slice(0, 10))))];
}

// ---- Abspann ----
// The season as a film: every scene is built once (`make` returns its node and an `update(p)` that draws progress p
// from 0 to 1), the player steps through them at the chosen tempo. Only what the game's own credits do not show: the
// race for the first place, the changes of the lead, the weeks of growth, the builds, the hours of the fights.
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { const t = clamp01(x); return t * t * (3 - 2 * t); };
const span = (p, a, b) => ease((p - a) / (b - a));  // p moves from a to b: 0 to 1, eased
const AB_DAY = (t) => new Date(t * 1000).toLocaleDateString("de-DE", { timeZone: TZ, day: "2-digit", month: "2-digit" });
const AB_COLORS = ["#3987e5", "#d99a1c", "#2fae6d", "#e5534b"];

function abScene(kicker, title, sub) {
  const body = el("div", { class: "ab-body" });
  return { body, root: el("div", { class: "ab-scene" }, el("div", { class: "ab-kick" }, kicker), el("h2", { class: "ab-h" }, title),
    sub ? el("p", { class: "ab-sub" }, sub) : null, body) };
}
const abNote = (text) => el("p", { class: "ab-note" }, text);
const abBig = (value, label) => {
  const num = el("b", {}, value), box = el("div", { class: "ab-stat" }, num, el("span", {}, label));
  return { box, set: (v) => { num.textContent = v; } };
};

// The highest gear score over time as a step line that draws itself; the first to 680 and to 681 pop up on the way.
function abWay(s) {
  const top = s.finale.top, W = 800, H = 320, m = { l: 44, r: 16, t: 14, b: 26 };
  const sc = abScene("Der Weg an die Spitze", "Der höchste Ausrüstungswert", "Die Linie zeigt den besten Wert der Saison, Schritt für Schritt");
  const ser = top.series, t0 = ser[0][0], t1 = Math.max(s.generated, ser[ser.length - 1][0]);
  const lo = Math.floor(Math.min(...ser.map((r) => r[1])) / 50) * 50, hi = Math.ceil(top.score / 50) * 50;
  const X = (t) => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "ab-svg short", role: "img", "aria-label": "Höchster Ausrüstungswert der Saison" });
  for (let v = lo; v <= hi; v += 50) {
    svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: "ab-grid" }), sv("text", { x: m.l - 6, y: Y(v) + 4, class: "ab-axis", "text-anchor": "end" }, String(v)));
  }
  const steps = [];
  ser.forEach(([t, v], i) => { if (i) steps.push([X(t), Y(ser[i - 1][1])]); steps.push([X(t), Y(v)]); });
  steps.push([X(t1), Y(top.score)]);
  const line = sv("polyline", { class: "ab-line", fill: "none" });
  const dot = sv("circle", { r: 5, class: "ab-dot" });
  svg.append(line, dot);
  const marks = [[top.first_alt, top.alt], [top.first, top.score]].filter(([f]) => f).map(([f, v]) => {
    const g = sv("g", { class: "ab-mark" }, sv("circle", { cx: X(f.t), cy: Y(v), r: 6 }));
    svg.append(g);
    return { g, t: f.t, f, v };
  });
  const tag = el("div", { class: "ab-cap" }), val = el("div", { class: "ab-bignum" });
  const row = el("div", { class: "ab-row" });
  sc.body.append(svg, val, tag, row);
  return { node: sc.root, update(p) {
    const x = X(t0 + (t1 - t0) * span(p, 0.04, 0.9)), vis = steps.filter(([sx]) => sx <= x);
    const last = vis[vis.length - 1] || steps[0];
    line.setAttribute("points", [...vis, [x, last[1]]].map((q) => q.map((n) => n.toFixed(1)).join(",")).join(" "));
    dot.setAttribute("cx", x.toFixed(1)); dot.setAttribute("cy", last[1].toFixed(1));
    const now = t0 + (t1 - t0) * span(p, 0.04, 0.9);
    tag.textContent = AB_DAY(now);
    val.textContent = fmtInt([...ser].reverse().find((r) => r[0] <= now)?.[1] ?? ser[0][1]);
    const shown = marks.filter((k) => k.t <= now);
    marks.forEach((k) => k.g.classList.toggle("on", k.t <= now));
    row.replaceChildren(...shown.map((k) => el("div", { class: "ab-stat small" }, el("b", {}, fmtInt(k.v)),
      el("span", {}, `Erster: ${k.f.name}`), el("span", {}, fmtSince(k.f.t).replace(/ Uhr$/, "")))));
  } };
}

// How often the first place changed, day by day.
function abOvertakes(s) {
  const o = s.abspann.overtakes;
  const sc = abScene("Überholmanöver", `${fmtInt(o.changes)} Mal wechselte Platz 1`, "Jeder Balken ist ein Tag");
  const max = Math.max(...o.per_day.map((r) => r[1])), bars = o.per_day.map(([d, n]) => ({ d, n, i: el("i", { title: `${AB_DAY(d)}: ${n}` }) }));
  const chart = el("div", { class: "ab-bars" }, ...bars.map((b) => b.i));
  const peak = o.per_day.reduce((a, b) => (b[1] > a[1] ? b : a));
  const changes = abBig("", "Wechsel"), ties = abBig("", "bei gleichem Wert: das Silber entschied"), longest = abBig("", "längste Serie am Stück");
  sc.body.append(chart, el("div", { class: "ab-row" }, changes.box, ties.box, longest.box), el("div", { class: "ab-cap" }, `Am meisten los war der ${AB_DAY(peak[0])} mit ${peak[1]} Wechseln`));
  const holder = s.finale.top.holders.find((h) => h[0] === o.longest.login);
  const who = (holder ? holder[1] : o.longest.login);
  return { node: sc.root, update(p) {
    bars.forEach((b, k) => { b.i.style.height = `${(100 * b.n / max * span(p, 0.05 + 0.6 * k / bars.length, 0.2 + 0.6 * k / bars.length)).toFixed(1)}%`; });
    changes.set(fmtInt(o.changes * span(p, 0.1, 0.8)));
    ties.set(fmtInt(o.silver * span(p, 0.3, 0.9)));
    longest.set(p > 0.8 ? `${fmtDec(o.longest.hours, 0)} h (${who})` : `${fmtDec(o.longest.hours * span(p, 0.1, 0.8), 0)} h`);
  } };
}

// The top ten by gear score, gliding as the places change (the data of the Zeitraffer, from the gear era on).
function abRace(s, d) {
  const sc = abScene("Das Rennen", "Rangliste als Rennen", "Die zehn Besten, alle zwei Stunden ein Bild");
  const N = 10, row = 34, start = Math.max(0, d.frames.findIndex((t) => t >= BOARD_GEAR_SINCE)), F = d.frames.length;
  const rank = {}, score = {};
  d.rows.forEach((rw, k) => rw.slice(0, N + 1).forEach(([i, v], r) => { (rank[i] ||= new Uint8Array(F))[k] = r + 1; (score[i] ||= new Int16Array(F))[k] = v; }));
  const ids = Object.keys(rank).map(Number).filter((i) => rank[i].some((r, k) => r && r <= N && k >= start));
  const hue = (i) => (i * 137.508) % 360;
  const box = el("div", { class: "ab-race tl-box", style: `height:${N * row}px` });
  const rows = ids.map((i) => {
    const bar = el("span", { class: "tl-bar" }), sc2 = el("span", { class: "tl-score" }), rk = el("span", { class: "tl-rank" });
    const a = el("div", { class: "tl-row", style: `--h:${hue(i).toFixed(0)};height:${row}px;width:100%` }, bar, rk, el("span", { class: "tl-name" }, d.names[i]), sc2);
    box.append(a);
    return { i, a, bar, sc: sc2, rk };
  });
  const when = el("div", { class: "ab-cap" }), tie = el("div", { class: "ab-note" });
  const silver = new Map(s.board.map((r) => [r.login, r.silver]));  // the silver of the last run, shown on the last picture
  sc.body.append(box, when, tie);
  return { node: sc.root, update(p) {
    const f = start + (F - 1 - start) * span(p, 0.02, 0.96), a = Math.floor(f), b = Math.min(F - 1, a + 1);
    const t = clamp01((f - a - 0.2) / 0.6), w = t * t * (3 - 2 * t);
    let lo = Infinity, hi = 0; const on = [];
    for (const r of rows) {
      const ra = rank[r.i][a], rb = rank[r.i][b], pa = ra ? ra - 1 : N + 1, pb = rb ? rb - 1 : N + 1, pos = pa + (pb - pa) * w;
      if (pos >= N) { r.a.style.display = "none"; continue; }
      const sa = score[r.i][a] || score[r.i][b], sb = score[r.i][b] || sa, v = sa + (sb - sa) * w;
      r.a.style.display = ""; r.a.style.transform = `translateY(${(pos * row).toFixed(1)}px)`;
      r.a.style.opacity = String(clamp01(N - pos)); r.a.classList.toggle("lead", pos < 0.5);
      const end = Math.round(f) >= F - 1 && silver.get(d.logins[r.i]) != null;
      r.rk.textContent = String((w < 0.5 ? ra || rb : rb || ra)); r.sc.textContent = end ? `${fmtInt(v)} | ${fmtSilver(silver.get(d.logins[r.i]))} Silber` : fmtInt(v);
      lo = Math.min(lo, v); hi = Math.max(hi, v); on.push([r, v]);
    }
    for (const [r, v] of on) r.bar.style.width = `${(10 + 90 * (v - lo * 0.97) / (hi - lo * 0.97 || 1)).toFixed(1)}%`;
    when.textContent = fmtTime(d.frames[Math.round(f)]);
    tie.textContent = hi === lo ? "Alle zehn stehen auf dem Höchstwert, die Reihenfolge entscheidet das Silber (Stand der letzten Messung)" : "";
  } };
}

// The highest gear score gained per day; the days the game's rules changed carry a marker.
function abGrowth(s) {
  const g = s.abspann.growth;
  const sc = abScene("Wachstum", "Wie schnell die Spitze wuchs", "Zuwachs des höchsten Ausrüstungswerts pro Tag");
  const max = Math.max(...g.gains.map((r) => r[1]), 1), marks = new Map(g.marks);
  const cols = g.gains.map(([d, n]) => ({ d, n, mk: marks.get(d), i: el("i", { title: `${AB_DAY(d)}: ${signed(n)}` }) }));
  const chart = el("div", { class: "ab-bars tall" }, ...cols.map((c) => el("div", { class: "ab-col" }, c.mk ? el("u", { title: "Regeländerung" }, "◆") : null, c.i)));
  const cap = el("div", { class: "ab-cap" }), note = el("div", { class: "ab-note" });
  sc.body.append(chart, cap, note, abNote("◆ = an diesem Tag änderte das Spiel eine Regel"));
  return { node: sc.root, update(p) {
    const k = Math.floor(g.gains.length * span(p, 0.05, 0.95));
    cols.forEach((c, j) => { c.i.style.height = `${(100 * Math.max(c.n, 0) / max * span(p, 0.05 + 0.9 * j / cols.length, 0.12 + 0.9 * j / cols.length)).toFixed(1)}%`; });
    const cur = cols[Math.min(k, cols.length - 1)];
    cap.textContent = `${AB_DAY(cur.d)}: ${signed(cur.n)}`;
    note.textContent = cur.mk ? `Geändert: ${cur.mk.map((r) => RULE_INFO[r]?.label || r).join(", ")}` : "";
  } };
}

// The average gear score of the active members, guild against guild.
function abGuilds(s) {
  const gl = s.abspann.guilds, W = 800, H = 300, m = { l: 44, r: 16, t: 12, b: 24 };
  const sc = abScene("Die Gilden im Duell", "Gilde gegen Gilde", "Durchschnittlicher Ausrüstungswert der aktiven Mitglieder");
  const all = gl.flatMap((g) => g.series), t0 = Math.min(...all.map((r) => r[0])), t1 = Math.max(...all.map((r) => r[0]));
  const lo = Math.floor(Math.min(...all.map((r) => r[1])) / 50) * 50, hi = Math.ceil(Math.max(...all.map((r) => r[1])) / 50) * 50;
  const X = (t) => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "ab-svg", role: "img", "aria-label": "Durchschnittlicher Ausrüstungswert der Gilden" });
  for (let v = lo; v <= hi; v += 100) svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: "ab-grid" }), sv("text", { x: m.l - 6, y: Y(v) + 4, class: "ab-axis", "text-anchor": "end" }, String(v)));
  const colorOf = (g, i) => GUILD_COLORS[g.login] || SPARE_COLORS[i % SPARE_COLORS.length];  // the colours of the guild comparison
  const lines = gl.map((g, i) => ({ g, c: colorOf(g, i), pl: sv("polyline", { fill: "none", class: "ab-line", style: `stroke:${colorOf(g, i)}` }) }));
  svg.append(...lines.map((l) => l.pl));
  const legend = el("div", { class: "ab-legend col" });
  sc.body.append(svg, legend);
  return { node: sc.root, update(p) {
    const now = t0 + (t1 - t0) * span(p, 0.04, 0.94), vals = [];
    for (const l of lines) {
      const pts = l.g.series.filter((r) => r[0] <= now);
      l.pl.setAttribute("points", pts.map(([t, v]) => `${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join(" "));
      vals.push([l, pts.length ? pts[pts.length - 1][1] : null]);
    }
    legend.replaceChildren(...vals.sort((a, b) => (b[1] || 0) - (a[1] || 0)).map(([l, v]) => el("span", { style: `color:${l.c}` }, `${l.g.name} ${v == null ? "" : fmtDec(v, 0)}`)));
  } };
}

// Attack, defense and support as the average share among the players whose split is known, one line each.
function abBuilds(s) {
  const rows = s.abspann.builds, W = 800, H = 300, m = { l: 44, r: 16, t: 12, b: 24 };
  const sc = abScene("Die Bauweise", "Wie sich die Builds verschoben", `Durchschnittlicher Anteil von Angriff, Verteidigung und Unterstützung am Ausrüstungswert, rund ${fmtInt(rows[rows.length - 1][4])} Spieler je Zeitpunkt`);
  const all = rows.flatMap((r) => [r[1], r[2], r[3]]), lo = Math.floor(Math.min(...all) * 20) / 20, hi = Math.ceil(Math.max(...all) * 20) / 20;
  const t0 = rows[0][0], t1 = rows[rows.length - 1][0];
  const X = (t) => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "ab-svg", role: "img", "aria-label": "Anteile von Angriff, Verteidigung und Unterstützung" });
  for (let v = lo; v <= hi + 1e-9; v += 0.05) svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: "ab-grid" }), sv("text", { x: m.l - 6, y: Y(v) + 4, class: "ab-axis", "text-anchor": "end" }, `${Math.round(v * 100)} %`));
  const defs = [[1, "Angriff", "var(--atk)"], [2, "Verteidigung", "var(--def)"], [3, "Unterstützung", "var(--sup)"]];
  const lines = defs.map(([i, name, col]) => ({ i, name, col, pl: sv("polyline", { fill: "none", class: "ab-line", style: `stroke:${col}` }) }));
  svg.append(...lines.map((l) => l.pl));
  const legend = el("div", { class: "ab-legend col" }), when = el("div", { class: "ab-cap" });
  sc.body.append(svg, legend, when);
  return { node: sc.root, update(p) {
    const f = (rows.length - 1) * span(p, 0.05, 0.94), a = Math.floor(f), b = Math.min(rows.length - 1, a + 1), w = f - a;
    const t = rows[a][0] + (rows[b][0] - rows[a][0]) * w;
    for (const l of lines) {
      const pts = rows.slice(0, a + 1).map((r) => [X(r[0]), Y(r[l.i])]);
      pts.push([X(t), Y(rows[a][l.i] + (rows[b][l.i] - rows[a][l.i]) * w)]);
      l.pl.setAttribute("points", pts.map((q) => q.map((n) => n.toFixed(1)).join(",")).join(" "));
      l.v = pts[pts.length - 1];
    }
    legend.replaceChildren(...lines.map((l) => el("span", { style: `color:${l.col}` }, `${l.name} ${fmtDec(100 * (rows[a][l.i] + (rows[b][l.i] - rows[a][l.i]) * w), 0)} %`)));
    when.textContent = AB_DAY(t);
  } };
}

// Day one against the end: the first place and the hurdle of place 100.
function abCapsule(s, d, tl) {
  const sc = abScene("Die Zeitkapsel", "Tag 1 gegen heute", "Der erste Stand unserer Messung neben dem letzten");
  const f0 = 0, f1 = d.frames.length - 1, first = d.rows[f0][0], last = d.rows[f1][0];
  const border = (tl?.border || []).filter((v) => v != null);
  const mk = (label, t, name, v, hurdle) => ({ label, t, name, v, hurdle });
  const A = mk("Am Anfang", d.frames[f0], d.names[first[0]], first[1], border[0]), B = mk("Zum Schluss", d.frames[f1], d.names[last[0]], last[1], border[border.length - 1]);
  const cells = [A, B].map((c) => ({ c, v: abBig("", `Platz 1: ${c.name}`), h: abBig("", "Platz 100") }));
  sc.body.append(el("div", { class: "ab-pair" }, ...cells.map(({ c, v, h }) => el("div", {}, el("div", { class: "ab-cap" }, `${c.label}, ${AB_DAY(c.t)}`), v.box, c.hurdle != null ? h.box : null))));
  return { node: sc.root, update(p) {
    cells.forEach(({ c, v, h }, k) => { const w = span(p, 0.1 + 0.35 * k, 0.5 + 0.35 * k); v.set(fmtInt(c.v * w)); h.set(fmtInt((c.hurdle || 0) * w)); });
  } };
}

// The last board, from place 1 to 100, scrolling like the names at the end of a film.
function abHall(s) {

// ---- Dein Abspann: the same film for one player, from the player's own file (p/<login>.json) ----
// A line chart that draws itself: the player's `main` series and, behind it, `extra` lines of the field. `invert`:
// the first place on top (the rank). Returns the svg and `draw(p)`, which reveals up to the point in time p stands for.
function abLine(main, { extra = [], invert = false, step = false, until }) {
  const W = 800, H = 300, m = { l: 52, r: 16, t: 12, b: 24 };
  const all = [main, ...extra.map((e) => e.series)].filter((x) => x.length);
  const t0 = Math.min(...all.map((x) => x[0][0])), t1 = Math.max(until || 0, ...all.map((x) => x[x.length - 1][0]));
  const vals = all.flatMap((x) => x.map((r) => r[1]));
  const stepSize = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000]
    .find((q) => (Math.max(...vals) - Math.min(...vals)) / q <= 6) || 100000;
  const lo = Math.floor(Math.min(...vals) / stepSize) * stepSize, hi = Math.max(Math.ceil(Math.max(...vals) / stepSize) * stepSize, lo + stepSize);
  const X = (t) => m.l + (t - t0) / (t1 - t0 || 1) * (W - m.l - m.r);
  const Y = (v) => { const f = (v - lo) / (hi - lo); return m.t + (invert ? f : 1 - f) * (H - m.t - m.b); };
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "ab-svg", role: "img" });
  for (let v = lo; v <= hi + 1e-9; v += stepSize) svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: "ab-grid" }), sv("text", { x: m.l - 6, y: Y(v) + 4, class: "ab-axis", "text-anchor": "end" }, fmtInt(v)));
  const lines = [...extra.map((e) => ({ ...e, pl: sv("polyline", { fill: "none", class: "ab-line thin", style: `stroke:${e.color}` }) })),
    { series: main, color: "#f0c35a", pl: sv("polyline", { fill: "none", class: "ab-line" }) }];
  svg.append(...lines.map((l) => l.pl));
  const dot = sv("circle", { r: 5, class: "ab-dot" });
  svg.append(dot);
  return { svg, t0, t1, draw(prog) {
    const now = t0 + (t1 - t0) * prog, out = [];
    for (const l of lines) {
      const pts = [];
      l.series.forEach(([t, v], i) => {
        if (t > now) return;
        if (step && i && pts.length) pts.push([X(t), pts[pts.length - 1][1]]);
        pts.push([X(t), Y(v)]);
      });
      if (pts.length) pts.push([X(now), pts[pts.length - 1][1]]);
      l.pl.setAttribute("points", pts.map((q) => q.map((n) => n.toFixed(1)).join(",")).join(" "));
      const vis = l.series.filter((r) => r[0] <= now);
      out.push(vis.length ? vis[vis.length - 1][1] : null);
      if (l.series === main && pts.length) { dot.setAttribute("cx", pts[pts.length - 1][0].toFixed(1)); dot.setAttribute("cy", pts[pts.length - 1][1].toFixed(1)); }
    }
    return { now, values: out };
  } };
}

function abMeTitle(p) {
  const sc = abScene("Dein Abspann", p.name, p.guild ? p.guild.name : "In keiner Gilde");
  const b = p.standing.better >= 99.95 ? "alle" : `${fmtDec(p.standing.better, 1)} %`;
  sc.body.append(el("div", { class: "ab-row" },
    el("div", { class: "ab-stat" }, el("b", {}, fmtInt(p.gear)), el("span", {}, "Ausrüstungswert zum Schluss")),
    p.board_rank ? el("div", { class: "ab-stat" }, el("b", {}, `#${fmtInt(p.board_rank)}`), el("span", {}, "in der Rangliste")) : null,
    el("div", { class: "ab-stat" }, el("b", {}, b), el("span", {}, `mehr als von ${fmtInt(p.standing.of)} Spielern`))));
  return { node: sc.root, update() {} };
}

function abMeWay(p, ctx) {
  const sc = abScene("Dein Weg", "Wie dein Ausrüstungswert wuchs", "Jeder Schritt der Linie ist ein Fund, ein Kauf oder eine Verbesserung");
  const g = p.series.gear, chart = abLine(g, { step: true, until: ctx.summary.generated });
  const cap = el("div", { class: "ab-cap" }), row = el("div", { class: "ab-row" });
  const days = new Map();
  g.forEach(([t, v]) => { const k = AB_DAY(t); days.set(k, [...(days.get(k) || [v, t, v]).slice(0, 2), v]); });
  const best = [...days.entries()].map(([k, [first, , last]]) => [k, last - first]).reduce((a, b) => (b[1] > a[1] ? b : a), ["", 0]);
  const start = abBig("", `am ${AB_DAY(g[0][0])}`), end = abBig("", "zum Schluss");
  row.append(start.box, end.box, ...(best[1] > 0 ? [el("div", { class: "ab-stat" }, el("b", {}, signed(best[1])), el("span", {}, `bester Tag, der ${best[0]}`))] : []));
  sc.body.append(chart.svg, cap, row);
  return { node: sc.root, update(prog) {
    const r = chart.draw(span(prog, 0.04, 0.92));
    cap.textContent = AB_DAY(r.now);
    start.set(fmtInt(g[0][1])); end.set(fmtInt(r.values[r.values.length - 1] ?? g[0][1]));
  } };
}

// Your gear against the median and the best tenth of all active players (the data of the Zeitraffer).
function abMeField(p, ctx) {
  const tl = ctx.tl, grp = tl && tl.groups[0];
  const sc = abScene("Du gegen das Feld", "Wie du dich gegen alle behauptest", "Dein Ausrüstungswert gegen den Median und die besten zehn Prozent der aktiven Spieler");
  const pick = (idx) => tl.frames.map((t, i) => [t, grp.pct[i][idx]]).filter((r) => r[1] != null);
  const chart = abLine(p.series.gear.filter((r) => r[0] >= tl.frames[0]), { until: ctx.summary.generated, extra: [
    { series: pick(10), color: "#8f8e86", label: "Median" }, { series: pick(18), color: "#3987e5", label: "Beste 10 %" }] });
  const legend = el("div", { class: "ab-legend" });
  sc.body.append(chart.svg, legend);
  return { node: sc.root, update(prog) {
    const r = chart.draw(span(prog, 0.04, 0.92));
    legend.replaceChildren(el("span", { style: "color:#8f8e86" }, `Median ${r.values[0] == null ? "" : fmtInt(r.values[0])}`),
      el("span", { style: "color:#3987e5" }, `Beste 10 % ${r.values[1] == null ? "" : fmtInt(r.values[1])}`),
      el("span", { style: "color:#f0c35a" }, `Du ${r.values[2] == null ? "" : fmtInt(r.values[2])}`));
  } };
}

function abMeRank(p, ctx) {
  const r = p.series.rank.filter((x) => x[1] >= 1), best = Math.min(...r.map((x) => x[1]));
  const sc = abScene("Dein Platz", "Dein Weg durch die Rangliste", "Platz 1 steht oben; zu sehen sind nur die Zeiten in den Top 100");
  const chart = abLine(r, { invert: true, step: true, until: ctx.summary.generated }), cap = el("div", { class: "ab-cap" });
  const now = abBig("", "Platz"), bestBox = abBig(`#${fmtInt(best)}`, "beste Platzierung");
  sc.body.append(chart.svg, cap, el("div", { class: "ab-row" }, now.box, bestBox.box));
  return { node: sc.root, update(prog) {
    const x = chart.draw(span(prog, 0.04, 0.92));
    cap.textContent = AB_DAY(x.now); now.set(x.values[x.values.length - 1] == null ? "-" : `#${fmtInt(x.values[x.values.length - 1])}`);
  } };
}

// The split of attack, defense and support next to what players of your main stat usually have.
function abMeBuild(p) {
  const sp = p.split, med = p.peers && p.peers.cls && p.peers.cls.med;
  const sc = abScene("Dein Build", "Wie sich dein Wert verteilt", med ? "Du, und was Spieler mit demselben Hauptwert im Schnitt haben" : "Angriff, Verteidigung und Unterstützung");
  const mk = (name, v) => {
    const sum = (v.atk || 0) + (v.def || 0) + (v.sup || 0) || 1, segs = [["atk", "ATK"], ["def", "DEF"], ["sup", "SUP"]].map(([k, l]) => ({ k, l, n: v[k] || 0, i: el("i", { class: k }, "") }));
    const bar = el("div", { class: "ab-split" }, ...segs.map((x) => x.i));
    return { name, sum, segs, bar, node: el("div", { class: "ab-rows" }, el("h3", {}, name), bar,
      el("div", { class: "ab-legend" }, ...segs.map((x) => el("span", { style: `color:var(--${x.k})` }, `${x.l} ${fmtDec(100 * x.n / sum, 0)} %`)))) };
  };
  const rows = [mk("Du", sp), ...(med ? [mk("Typisch für deine Klasse", med)] : [])];
  sc.body.append(...rows.map((r) => r.node));
  return { node: sc.root, update(prog) {
    const w = span(prog, 0.1, 0.7);
    rows.forEach((r) => r.segs.forEach((x) => { x.i.style.width = `${(100 * x.n / r.sum * w).toFixed(2)}%`; }));
  } };
}

function abMeSilver(p, ctx) {

// A search for another player's film: a box with the names (players.json) and a button.

  load("players.json").then((rows) => names.append(...rows.slice(0, 400).map((r) => el("option", { value: r[1] })))).catch(() => {});
  const go = () => {
    const q = input.value.trim().toLowerCase();
    load("players.json").then((rows) => { const hit = rows.find((r) => r[0] === q || r[1].toLowerCase() === q); if (hit) location.hash = `#/abspann/${encodeURIComponent(hit[0])}`; }).catch(() => {});
