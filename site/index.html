<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat-RPG Statistik</title>
<meta name="description" content="Ranglisten, Verlauf und Prognosen für das Twitch-Chat-RPG rpg.sola.rip">
<style>
  :root {
    color-scheme: dark;
    --page: #131312;
    --surface-1: #1a1a19;
    --surface-2: #262624;
    --border: #383835;
    --grid: #2c2c2a;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-2: #d99a1c;
    --accent: #3987e5;
    --good: #2fae6d;
    --warning: #d99a1c;
    --critical: #e5534b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--text-primary);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1440px; margin: 0 auto; padding: 12px clamp(12px, 3vw, 20px); display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  header .tabs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs a { color: var(--text-secondary); text-decoration: none; padding: 5px 12px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--surface-2); }
  .tabs a:hover { border-color: var(--text-muted); }
  .tabs a[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--text-primary); }
  .sub { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .sub a { padding: 3px 10px; font-size: 13px; background: none; border-color: transparent; }
  .sub a[aria-current] { background: var(--surface-2); border-color: var(--border); color: var(--text-primary); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h1 a { color: inherit; text-decoration: none; }
  h2 { font-size: 13px; margin: 0 0 10px; font-weight: 600; color: var(--text-secondary);
       text-transform: uppercase; letter-spacing: .06em; }
  a { color: var(--accent); }
  .muted { color: var(--text-muted); }
  .secondary { color: var(--text-secondary); }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; }
  .grid { display: grid; gap: 12px; min-width: 0; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .two { grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); }
  .tile { padding: 10px 12px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .tile .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 2px 0; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { .tile .value { font-size: 20px; } }
  input, button { font: inherit; color: var(--text-primary); background: var(--surface-2);
                  border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; }
  button { cursor: pointer; } button:hover { border-color: var(--text-muted); }
  .seg { display: inline-flex; gap: 4px; }
  .seg button { padding: 2px 10px; font-size: 12px; }
  .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card > .head { margin-bottom: 8px; }
  .head h2 { margin: 0; }
  .search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
  .search input { width: 100%; }
  .suggest { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 5; background: var(--surface-2);
             border: 1px solid var(--border); border-radius: 6px; max-height: 320px; overflow: auto; }
  .suggest a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; color: var(--text-primary);
               text-decoration: none; }
  .suggest a:hover, .suggest a.on { background: var(--surface-1); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface-1); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td a { color: var(--text-primary); text-decoration: none; } td a:hover { text-decoration: underline; }
  .scroll { max-height: 520px; overflow: auto; }
  .wide-table { overflow-x: auto; }
  .up { color: var(--good); } .down { color: var(--critical); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2);
         border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; margin-left: 6px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart .axis text { fill: var(--text-muted); font-size: 11px; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .end { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
  .chart .endlabel { fill: var(--text-primary); font-size: 12px; font-weight: 600; }
  .chart .hair { stroke: var(--text-muted); stroke-width: 1; }
  .chart .empty { fill: var(--text-muted); font-size: 13px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
         border-radius: 6px; padding: 6px 9px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .tip strong { display: block; font-size: 14px; }
  .tip .key { display: inline-block; width: 12px; height: 2px; background: var(--series-1); vertical-align: middle; margin-right: 6px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  .facts dt { color: var(--text-secondary); } .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 100px 1fr 80px; gap: 8px; align-items: center; font-size: 13px; }
  .bar .track { position: relative; height: 18px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; height: 9px; background: var(--series-1); }
  .bar .peer { position: absolute; left: 0; bottom: 0; height: 9px; background: var(--series-2); }
  .bar .val { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .note { color: var(--text-secondary); font-size: 13px; margin: 6px 0 0; }
  ul.note { padding-left: 18px; }
  ul.note li { margin-top: 6px; }
  footer { color: var(--text-muted); font-size: 12px; padding: 8px 0 20px; }
  footer a { color: var(--text-secondary); }
</style>
</head>
<body>
<main>
  <header>
    <h1><a href="#/">Chat-RPG Statistik</a></h1>
    <div class="search">
      <input id="q" type="search" placeholder="Spieler suchen (Twitch-Name)" autocomplete="off" aria-label="Spieler suchen">
      <div id="suggest" class="suggest" hidden></div>
    </div>
    <nav class="tabs">
      <a href="#/rangliste" data-view="rangliste">Ranglisten</a>
      <a href="#/gilden" data-view="gilden">Gilden</a>
      <a href="#/kaempfe" data-view="kaempfe">Kämpfe</a>
    </nav>
  </header>
  <nav id="subtabs" class="tabs sub" aria-label="Bereich" hidden></nav>
  <div id="view" class="grid"></div>
  <footer id="footer"></footer>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const fmtInt = (n) => n == null ? "-" : Math.round(n).toLocaleString("de-DE");
const fmtDec = (n, d = 1) => n == null ? "-" : n.toLocaleString("de-DE", { maximumFractionDigits: d });
const count = (n, one, many) => `${fmtInt(n)} ${n == 1 ? one : many}`;  // count(1, "Punkt", "Punkte") -> "1 Punkt"
// Every amount in silver (never gold), with the German thousands separator: 1234 -> "1.234 Silber".
const fmtSilver = (s) => s == null ? "-" : `${fmtInt(s)} Silber`;
const signed = (n, d = 0) => n == null ? "-" : (n > 0 ? "+" : "") + (d ? fmtDec(n, d) : fmtInt(n));
const TZ = "Europe/Berlin";  // the game runs on Berlin time, whatever device views the page
const fmtTime = (t) => new Date(t * 1000).toLocaleString("de-DE", { timeZone: TZ, weekday: "short", day: "2-digit",
  month: "2-digit", hour: "2-digit", minute: "2-digit" });
const fmtClock = (t) => new Date(t * 1000).toLocaleTimeString("de-DE", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const iso = (s) => s ? Date.parse(s) / 1000 : null;
const pct = (a, b) => b ? `${fmtDec(100 * a / b, 0)} %` : "-";
// "in weniger als einem Tag" / "in etwa 3 Tagen"
const inDays = (d) => d < 1 ? "in weniger als einem Tag" : `in etwa ${count(Math.ceil(d), "Tag", "Tagen")}`;
const KINDS = { BOSS: "Boss", ADVENTURE: "Abenteuer", RAID: "Überfall" };
const fightLabel = (f) => f.kind === "BOSS" ? `Boss ${f.name || ""}, Stufe ${f.level ?? f.bossLevel ?? "?"}`
  : `${KINDS[f.kind] || f.kind} Schwierigkeit ${f.level ?? f.difficulty ?? "?"}`;
// The repo behind the page (user.github.io/repo), for the watchlist form and the footer.
const REPO = location.hostname.endsWith(".github.io")
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}` : "Velcorn/Chat-RPG-Stats";
const WATCH_FORM = `https://github.com/${REPO}/issues/new?template=watchlist.yml`;

const cache = {};
function load(path) {
  if (!cache[path]) {
    cache[path] = fetch("data/" + path).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
    cache[path].catch(() => delete cache[path]);
  }
  return cache[path];
}

function tile(label, value, sub) {
  return el("div", { class: "card tile" }, el("div", { class: "label" }, label), el("div", { class: "value", title: value }, value),
    el("div", { class: "sub" }, sub ?? ""));
}
function card(title, ...body) { return el("section", { class: "card" }, title ? el("h2", {}, title) : null, ...body); }
function delta(n, d = 0) { return el("span", { class: n > 0 ? "up" : n < 0 ? "down" : "muted" }, signed(n, d)); }
function playerLink(r) { return el("a", { href: `#/spieler/${r.login}` }, r.name || r.login); }
function table(cols, rows) {
  return el("div", { class: "wide-table" }, el("table", {},
    el("thead", {}, el("tr", {}, cols.map((c) => el("th", { class: c.num ? "num" : null, title: c.title }, c.label)))),
    el("tbody", {}, rows.map((r) => el("tr", {}, cols.map((c) => el("td", { class: c.num ? "num" : null }, c.get(r))))))));
}
function seg(options, current, onPick) {
  const box = el("div", { class: "seg" });
  for (const [key, label] of options) {
    const b = el("button", { "aria-pressed": String(key === current) }, label);
    b.addEventListener("click", () => {
      for (const o of box.children) o.setAttribute("aria-pressed", String(o === b));
      onPick(key);
    });
    box.append(b);
  }
  return box;
}

// ---- chart (a line chart drawn as steps: a value holds until the next change) ----
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
  const ticks = [];
  for (let v = Math.floor(lo / step) * step; v < hi + step - step * 1e-9; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return ticks;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs = {}, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}
function lineChart(box, points, { label, fmt = fmtInt, invert = false, until, empty = "noch keine Daten",
  missing = invert ? "nicht in den Top 100" : "-" }) {
  box.replaceChildren();
  if (until && points.length && until > points[points.length - 1].t) points = [...points, { t: until, v: points[points.length - 1].v }];
  const lastPt = points.filter((p) => p.v != null).pop();
  const endText = lastPt ? (invert ? "#" + lastPt.v : fmt(lastPt.v)) : "";
  const W = Math.max(220, box.clientWidth), H = 220, m = { l: 60, r: 16 + endText.length * 7.5, t: 10, b: 22 };
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });
  box.append(svg);
  const pts = points.filter((p) => p.v != null);
  if (pts.length === 0) {
    svg.append(sv("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "empty" }, empty));
    return;
  }
  const t0 = Math.min(...points.map((p) => p.t)), t1 = Math.max(...points.map((p) => p.t));
  let lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v));
  let ticks = niceTicks(lo, hi).filter((v) => Number.isInteger(v));
  if (invert) ticks = [...new Set(ticks.map((v) => Math.max(1, v)))];
  if (!ticks.length) ticks = [lo];
  lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  if (lo === hi) hi = lo + 1;
  const x = (t) => m.l + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (v) => { const f = (v - lo) / (hi - lo); return m.t + (invert ? f : 1 - f) * (H - m.t - m.b); };
  const axis = sv("g", { class: "axis" });
  for (const v of ticks) {
    axis.append(sv("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: "gridline" }));
    axis.append(sv("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, invert ? "#" + v : fmtInt(v)));
  }
  const xt = t1 === t0 ? 0 : Math.max(1, Math.min(4, Math.floor((W - m.l - m.r) / 75)));
  for (let i = 0; i <= xt; i++) {
    const t = t0 + (t1 - t0) * i / xt;
    axis.append(sv("text", { x: x(t), y: H - 4, "text-anchor": xt === 0 ? "middle" : i === 0 ? "start" : i === xt ? "end" : "middle" },
      (t1 - t0) > 2 * 86400 ? new Date(t * 1000).toLocaleDateString("de-DE", { timeZone: TZ, day: "2-digit", month: "2-digit" }) : fmtClock(t)));
  }
  svg.append(axis);
  let d = "", prev = null;
  for (const p of points) {
    if (p.v == null) { prev = null; continue; }
    d += prev == null ? `M${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`
      : `L${x(p.t).toFixed(1)},${y(prev).toFixed(1)}L${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`;
    prev = p.v;
  }
  svg.append(sv("path", { d, class: "line" }));
  const last = pts[pts.length - 1];
  svg.append(sv("circle", { cx: x(last.t), cy: y(last.v), r: 4, class: "end" }));
  svg.append(sv("text", { x: x(last.t) + 8, y: y(last.v) + 4, class: "endlabel" }, endText));
  const hair = sv("line", { y1: m.t, y2: H - m.b, class: "hair", visibility: "hidden" });
  const dot = sv("circle", { r: 4, class: "end", visibility: "hidden" });
  const hit = sv("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" });
  svg.append(hair, dot, hit);
  const tip = el("div", { class: "tip" });
  box.append(tip);
  hit.addEventListener("pointermove", (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let best = points[0];
    for (const p of points) if (Math.abs(x(p.t) - px) < Math.abs(x(best.t) - px)) best = p;
    const cx = x(best.t);
    hair.setAttribute("x1", cx); hair.setAttribute("x2", cx); hair.setAttribute("visibility", "visible");
    if (best.v != null) { dot.setAttribute("cx", cx); dot.setAttribute("cy", y(best.v)); dot.setAttribute("visibility", "visible"); }
    else dot.setAttribute("visibility", "hidden");
    tip.replaceChildren(el("strong", {}, best.v == null ? missing : (invert ? "#" + best.v : fmt(best.v))),
      el("span", { class: "key" }), el("span", { class: "muted" }, `${label} | ${fmtTime(best.t)}`));
    tip.style.display = "block";
    const left = cx * r.width / W;
    tip.style.left = Math.min(Math.max(0, left - tip.offsetWidth / 2), r.width - tip.offsetWidth) + "px";
    tip.style.top = "-6px";
  });
  hit.addEventListener("pointerleave", () => { hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
}
function chartCard(title, series, opts) {
  const box = el("div", { class: "chart" });
  requestAnimationFrame(() => lineChart(box, series.map(([t, v]) => ({ t, v })), { label: title, ...opts }));
  return card(title, box);
}

// ---- views ----
// Talent bonus = Kampfkraft minus the raw stats (the game shows no bonus itself).
const talentBonus = (r) => [r.atk, r.def, r.sup].some((x) => x == null) ? null : r.board_gear - r.atk - r.def - r.sup;

function viewFormula(s) {
  const bonus = s.board.map(talentBonus).filter((b) => b != null).sort((a, b) => a - b);
  const at = (q) => bonus[Math.min(bonus.length - 1, Math.floor(q * bonus.length))];
  const p = (...t) => el("p", { class: "note" }, ...t);
  return [
    card("Kampfkraft und Talentbonus",
      p("Kampfkraft = ATK + DEF + SUP + Talentbonus. Die Rangliste des Spiels sortiert seit dem 30.09.2026 danach. ",
        "Den Bonus zeigt das Spiel nicht an; die Spalte \"Bonus\" in der Rangliste ist Kampfkraft minus ATK, DEF und SUP. ",
        bonus.length ? `In den aktuellen Top 100: kleinster Bonus ${fmtInt(bonus[0])}, Median ${fmtInt(at(0.5))}, größter ${fmtInt(bonus[bonus.length - 1])}.` : ""),
      p("Die Formel steht nur auf dem Server. Alles unten ist eine Schätzung, abgeleitet aus den öffentlichen Werten, keine Angabe des Spiels.")),
    card("Geschätzte Formel",
      el("ul", { class: "note" },
        el("li", {}, el("b", {}, "Verteidiger mit vollem Bollwerk-Baum"), " (Bonus ab 135, 21 Spieler): Bonus etwa 225 + 0,32 x ATK - 0,63 x DEF + 0,28 x SUP, Abweichung um 9. ",
          "Umgerechnet: Kampfkraft etwa 225 + 1,32 x ATK + 0,37 x DEF + 1,28 x SUP. Ein Punkt ATK oder SUP zählt also etwa dreieinhalb Mal so viel wie ein Punkt DEF."),
        el("li", {}, el("b", {}, "Angreifer"), " (Bonus klar unter 135): Bonus etwa 0,36 x ATK (meist zwischen 0,30 und 0,39)."),
        el("li", {}, el("b", {}, "Ohne Talente"), ": etwa 45 von 166 Spielern haben Bonus 0 oder fast 0, vermutlich weil sie keine Talentpunkte verteilt haben."),
        el("li", {}, el("b", {}, "Unterstützer"), ": höchstens etwa 44, zu wenige Spieler für eine Formel.")),
      p("Grundlage: 166 Spieler aus den Ranglisten nach Kampfkraft und nach Quests (Stand 30.09.2026). Die 225 ist nur der Achsenabschnitt der Anpassung (der Wert bei ATK, DEF und SUP gleich 0, weit außerhalb der beobachteten Werte) und hat für sich keine Bedeutung; nur die Summe zählt. Die Zahlen ändern sich vermutlich, sobald mehr Daten da sind.")),
    card("Was über die Talente bekannt ist",
      el("ul", { class: "note" },
        el("li", {}, "Der Bonus kommt fast nur von wenigen Talenten; Füller wie Schildwall oder Zähigkeit bringen 0 bis 2."),
        el("li", {}, "Bei einem Verteidiger brachten Herausforderung (2 Punkte), Abhärtung (3) und Zweiter Atem (2) zusammen etwa 154. Die einzelnen Beiträge hängen von der Reihenfolge ab, sie addieren sich also nicht einfach."),
        el("li", {}, "Zwei Spieler mit demselben Talentbaum haben unterschiedlichen Bonus (z. B. 154 und 177); der Unterschied kommt von ihren Werten, nicht von den Talenten."))),
    card("Grenzen",
      el("ul", { class: "note" },
        el("li", {}, "Die Formel gilt nur im beobachteten Bereich (ATK 34 bis 97, DEF 112 bis 181 bei den Verteidigern) und ist nicht mit gezielten Ausrüstungswechseln geprüft."),
        el("li", {}, "Die Top 100 sind eine Auswahl: die obersten Plätze haben genau deshalb hohe Werte. Schwächere Spieler können anders rechnen."),
        el("li", {}, "Das Spiel kann die Formel jederzeit ändern, es gab schon Änderungen ohne Changelog."))),
  ];
}

function viewRanks(s, sub) {
  const scroll = (title, cols, rows) => [card(title, el("div", { class: "scroll" }, table(cols, rows)))];
  const valueBoard = (title, label, rows, fmt = fmtInt) => scroll(title, [
    { label: "#", num: true, get: (r) => r.rank },
    { label: "Spieler", get: playerLink },
    { label: "Gilde", get: (r) => r.guild || "-" },
    { label: label, num: true, get: (r) => fmt(r.value) },
    { label: "24 h", num: true, get: (r) => delta(r.value_day) },
  ], rows);
  if (sub === "formel") return viewFormula(s);
  if (sub === "silber") return valueBoard("Rangliste Silber (Top 100)", "Silber", s.silver);
  if (sub === "errungenschaften") return valueBoard("Rangliste Errungenschaften (Top 100)", "Errungenschaften", s.achievements);
  if (sub === "quests") return valueBoard("Rangliste Quests (Top 100)", "Quests", s.quests);
  if (sub === "aufsteiger") {
    let span = "day";
    const riserBox = el("div");
    const renderRisers = () => {
      const rows = s.risers[span];
      riserBox.replaceChildren(rows.length ? table([
        { label: "Spieler", get: playerLink },
        { label: "Gilde", get: (r) => r.guild || "-" },
        { label: "Kampfkraft", num: true, get: (r) => fmtInt(r.gear) },
        { label: span === "day" ? "24 Stunden" : "7 Tage", num: true, get: (r) => delta(r[span]) },
      ], rows) : el("p", { class: "note" }, span === "day" ? "Aufsteiger gibt es nach einem Tag Datensammlung." : "Aufsteiger der Woche gibt es nach sieben Tagen Datensammlung."));
    };
    renderRisers();
    return [el("section", { class: "card" }, el("div", { class: "head" }, el("h2", {}, "Aufsteiger (Kampfkraft)"),
      seg([["day", "24 Stunden"], ["week", "7 Tage"]], span, (k) => { span = k; renderRisers(); })), riserBox)];
  }
  const t = s.top100;
  return [
    el("div", { class: "grid tiles" },
      tile("Spieler erfasst", fmtInt(s.players), `davon ${fmtInt(s.active)} laut Gilde aktiv`),
      tile("Grenze Top 100", t.gear == null ? "-" : count(t.gear, "Punkt", "Punkte"), t.pace == null ? "Tempo dort: nach 12 Stunden Verlauf" : `Tempo dort: ${signed(t.pace, 1)} pro Tag`),
      tile("Gilden", fmtInt(s.guilds.length), `${fmtInt(s.guilds.reduce((a, g) => a + (g.members || 0), 0))} Mitglieder`),
      tile("Kämpfe erfasst", fmtInt(s.fights.total), s.since ? `seit ${fmtTime(s.since)}` : "")),
    ...scroll("Rangliste Kampfkraft (Top 100)", [
      { label: "#", num: true, get: (r) => r.rank },
      { label: "", num: true, title: "Plätze seit gestern", get: (r) => r.rank_change ? delta(r.rank_change) : "" },
      { label: "Spieler", get: playerLink },
      { label: "Gilde", get: (r) => r.guild || "-" },
      { label: "Kampfkraft", num: true, title: "Wert laut Rangliste des Spiels (hinkt der Gildenseite ein paar Minuten nach)", get: (r) => fmtInt(r.board_gear) },
      { label: "24 h", num: true, get: (r) => delta(r.day) },
      { label: "Pro Tag", num: true, title: "Durchschnitt der letzten 7 Tage", get: (r) => r.pace == null ? "-" : fmtDec(r.pace) },
      { label: "ATK / DEF / SUP", num: true, get: (r) => `${fmtInt(r.atk)} / ${fmtInt(r.def)} / ${fmtInt(r.sup)}` },
      { label: "Bonus", num: true, title: "Kampfkraft minus ATK, DEF und SUP: der Talentbonus (siehe Bonus-Formel)", get: (r) => fmtInt(talentBonus(r)) },
    ], s.board),
  ];
}

const draws = (st) => (st.drawsWon || 0) + (st.drawsLost || 0);
const STAT_ROWS = [
  ["Quests", (st) => `${fmtInt(st.questsCompleted)} geschafft, ${fmtInt(st.questsFailed)} gescheitert`],
  ["Im Kampf", (st) => `${fmtInt(st.damage)} Schaden, ${fmtInt(st.healing)} Heilung, ${count(st.fallen, "Mal", "Mal")} gefallen`],
  ["Markt", (st) => `${count(st.marketItemsBought, "Kauf", "Käufe")} für ${fmtSilver(st.marketSilverSpent)}, ${count(st.marketItemsSold, "Verkauf", "Verkäufe")} für ${fmtSilver(st.marketSilverEarned)}`],
  ["Verlosungen", (st) => `${fmtInt(st.drawsWon)} von ${fmtInt(draws(st))} gewonnen (${pct(st.drawsWon, draws(st))})`],
];
const FIGHT_KINDS = [["ADVENTURE", "Abenteuer", "adventures", "adventuresWon"], ["RAID", "Überfälle", "raids", "raidsWon"],
                     ["BOSS", "Bosse", "bosses", "bossesWon"]];

function gearCard(slots) {
  const rows = Object.entries(slots).map(([slot, v]) => ({ slot, label: v[0], name: v[1], tier: v[2], sum: v[1] ? v[3] + v[4] + v[5] : -1, v }));
  const worn = rows.filter((r) => r.name);
  const low = Math.min(...worn.map((r) => r.tier));
  const weakest = worn.filter((r) => r.tier === low);
  const lowSum = Math.min(...weakest.map((r) => r.sum));
  return card("Ausrüstung", el("div", { class: "scroll" }, table([
    { label: "Platz", get: (r) => r.label },
    { label: "Stück", get: (r) => r.name ? el("span", {}, r.name, r.v[6] ? el("span", { class: "tag" }, "beschädigt") : null,
        weakest.includes(r) && r.sum === lowSum ? el("span", { class: "tag" }, "schwächstes") : null) : el("span", { class: "muted" }, "leer") },
    { label: "Stufe", num: true, get: (r) => r.name ? r.tier : "-" },
    { label: "ATK / DEF / SUP", num: true, get: (r) => r.name ? `${fmtInt(r.v[3])} / ${fmtInt(r.v[4])} / ${fmtInt(r.v[5])}` : "-" },
  ], rows)), el("p", { class: "note" }, "Schwächstes Stück: niedrigste Stufe, bei Gleichstand die kleinste Summe. Dort lohnt sich ein Upgrade am meisten. Leere Plätze zählen dabei nicht."));
}

function fightCard(st) {
  const bars = el("div", { class: "bars" });
  for (const [, name, nKey, wKey] of FIGHT_KINDS) {
    const rate = st[nKey] ? 100 * st[wKey] / st[nKey] : null;
    bars.append(el("div", { class: "bar", style: "grid-template-columns:150px 1fr 60px" },
      el("span", {}, `${name} (${fmtInt(st[wKey])} von ${fmtInt(st[nKey])})`),
      el("div", { class: "track" }, rate == null ? null : el("div", { class: "fill", style: `width:${rate}%` })),
      el("span", { class: "val" }, pct(st[wKey], st[nKey]))));
  }
  return card("Kämpfe: Siegquote", bars, el("p", { class: "note" }, `Gefallen in ${pct(st.fallen, st.fights)} der Kämpfe, ${fmtInt(st.damage / Math.max(1, st.fights))} Schaden pro Kampf, höchste Bossstufe ${fmtInt(st.highestBossLevel)}.`));
}

async function viewPlayer(s, login) {
  let p;
  try { p = await load(`p/${encodeURIComponent(login)}.json`); }
  catch {
    return [card("Nicht gefunden", el("p", { class: "note" }, `"${login}" ist nicht erfasst. Erfasst sind alle Gildenmitglieder und die Top 100; Spieler ohne Gilde kommen über die `,
      el("a", { href: WATCH_FORM }, "Beobachtungsliste"), " dazu."))];
  }
  const f = p.forecast, g = p.guild;
  const tiles = el("div", { class: "grid tiles" },
    tile("Kampfkraft", fmtInt(p.gear), p.day == null ? "Änderung: nach einem Tag Verlauf" : `${signed(p.day)} in 24 Stunden`),
    tile("Rang", f.exact ? `#${f.rank}` : `etwa #${fmtInt(f.rank)}`, f.exact ? "in der Rangliste des Spiels" : "unter allen erfassten Spielern"),
    tile("Tempo", p.pace == null ? "-" : `${signed(p.pace, 1)} / Tag`, p.pace == null ? "nach 12 Stunden Verlauf" : "Durchschnitt der letzten 7 Tage"),
    tile("Nächster Rang", f.next_gap == null ? "Platz 1" : count(f.next_gap, "Punkt", "Punkte"), f.next_days ? `bei deinem Tempo ${inDays(f.next_days)}` : ""));

  let top100;
  if (f.top100_gap == null) top100 = p.board_rank ? `drin, Platz ${p.board_rank}` : "-";
  else top100 = `${count(f.top100_gap, "Punkt", "Punkte")} bis zur Grenze` + (f.top100_days ? `, bei deinem Tempo ${inDays(f.top100_days)} (die Grenze steigt mit)`
    : p.pace == null ? "" : ", bei diesem Tempo holst du sie nicht ein (sie steigt mindestens so schnell)");
  const forecast = el("dl", { class: "facts" },
    el("dt", {}, "Nächster Rang"), el("dd", {}, f.next_gap == null ? "Du bist ganz vorn." :
      `${count(f.next_gap, "Punkt", "Punkte")} fehlen` + (f.next_days ? `, bei deinem Tempo ${inDays(f.next_days)}` : "")),
    el("dt", {}, "Top 100"), el("dd", {}, top100),
    el("dt", {}, "Tempo"), el("dd", {}, p.peers && p.peers.pace != null && p.pace != null
      ? `Spieler mit ähnlichem Wert legen im Mittel ${signed(p.peers.pace, 1)} pro Tag zu, du ${signed(p.pace, 1)}.`
      : "Der Vergleich kommt nach 12 Stunden Verlauf."));

  const split = el("div", { class: "bars" });
  if (p.peers) {
    const mine = p.split.atk != null ? p.split : null;
    const max = Math.max(1, ...["atk", "def", "sup"].flatMap((k) => [p.peers[k], mine ? mine[k] : 0]));
    for (const [k, name] of [["atk", "Angriff"], ["def", "Verteidigung"], ["sup", "Unterstützung"]]) {
      split.append(el("div", { class: "bar" }, el("span", {}, name),
        el("div", { class: "track" }, mine ? el("div", { class: "fill", style: `width:${100 * mine[k] / max}%` }) : null,
          el("div", { class: "peer", style: `width:${100 * p.peers[k] / max}%` })),
        el("span", { class: "val" }, mine ? `${fmtInt(mine[k])} / ${fmtInt(p.peers[k])}` : fmtInt(p.peers[k]))));
    }
    split.append(el("div", { class: "legend" }, mine ? el("span", {}, el("i", { style: "background:var(--series-1)" }), p.name) : null,
      el("span", {}, el("i", { style: "background:var(--series-2)" }), `Mittel von ${p.peers.n} Spielern um ${fmtInt(p.peers.gear)} Punkte`)));
    if (!mine) split.append(el("p", { class: "note" }, "Die eigene Verteilung ist nur für die Top 100 und die Beobachtungsliste bekannt."));
  } else split.append(el("p", { class: "note" }, "Noch keine vergleichbaren Spieler."));

  const guild = g ? el("dl", { class: "facts" },
    el("dt", {}, "Gilde"), el("dd", {}, `${g.name} (${count(g.members, "Mitglied", "Mitglieder")})`),
    el("dt", {}, "Spendenrang"), el("dd", {}, `#${fmtInt(g.donation_rank)} mit ${fmtSilver(g.donated)}` + (g.donation_gap ? `, bis zum nächsten Platz fehlen ${fmtSilver(g.donation_gap)}` : "")),
    el("dt", {}, "Kampfkraft"), el("dd", {}, `#${fmtInt(g.gear_rank)} in der Gilde, ${fmtDec(g.gear_share, 2)} % ihres Gesamtwerts`))
    : el("p", { class: "note" }, "In keiner Gilde.");

  const out = [
    el("div", { class: "head" }, el("h1", {}, p.name), p.active === false ? el("span", { class: "tag" }, "laut Gilde inaktiv") : null),
    tiles,
    el("div", { class: "grid two" }, card("Prognose", forecast), card("Verteilung gegenüber ähnlichen Spielern", split)),
    el("div", { class: "grid two" }, chartCard("Kampfkraft", p.series.gear, { until: s.generated }), card("Gilde", guild)),
  ];
  const charts = [];
  if (p.series.rank.length) charts.push(chartCard("Rang (Top 100)", p.series.rank, { invert: true, until: s.generated }));
  if (p.series.silver.length) charts.push(chartCard("Silber", p.series.silver, { fmt: fmtSilver, until: s.generated }));
  for (let i = 0; i < charts.length; i += 2) out.push(el("div", { class: "grid two" }, ...charts.slice(i, i + 2)));

  if (p.watch) {
    const st = p.watch.stats || {};
    out.push(el("div", { class: "grid two" }, fightCard(st),
      card("Statistik (Beobachtungsliste)", el("dl", { class: "facts" },
        el("dt", {}, "Überleben"), el("dd", {}, `${fmtInt(p.watch.survival)} %, Leben ${fmtInt(p.watch.life)}`),
        STAT_ROWS.flatMap(([name, fn]) => [el("dt", {}, name), el("dd", {}, fn(st))])))));
    if (p.watch.slots && Object.keys(p.watch.slots).length) out.push(gearCard(p.watch.slots));
  } else {
    out.push(card("Mehr Statistik", el("p", { class: "note" }, "Ausrüstung je Platz, Kampfquoten, Markt und Verlosungen gibt es für Spieler auf der ",
      el("a", { href: WATCH_FORM }, "Beobachtungsliste"), ". Eintragen geht über ein kurzes Formular auf GitHub, nur für den eigenen Namen.")));
  }
  return out;
}

function viewGuild(s, login) {
  const g = s.guilds.find((x) => x.login === login);
  return [el("section", { class: "grid" },
    el("div", { class: "head" }, el("h1", {}, g.name)),
    el("div", { class: "grid tiles" },
      tile("Kasse", fmtSilver(g.treasury), `gespendet insgesamt: ${fmtSilver(g.donated)}`),
      tile("Mitglieder", fmtInt(g.members), `${fmtInt(g.active)} aktiv (${pct(g.active, g.members)})`),
      tile("Kampfkraft", fmtInt(g.gear), g.day ? `${signed(g.day)} in 24 Stunden` : "Summe aller Mitglieder"),
      tile("Bosse", `${fmtInt(g.boss_wins)} Siege`, `${count(g.boss_losses, "Niederlage", "Niederlagen")}, Überfallstufe ${fmtInt(g.raid)}`)),
    el("div", { class: "grid two" },
      chartCard("Kasse", g.series.map((r) => [r[0], r[1]]), { fmt: fmtSilver, until: s.generated }),
      chartCard("Aktive Mitglieder", g.series.map((r) => [r[0], r[3]]), { until: s.generated })),
    el("div", { class: "grid two" },
      card("Höchste Kampfkraft", table([
        { label: "Spieler", get: playerLink }, { label: "Kampfkraft", num: true, get: (r) => fmtInt(r.gear) },
        { label: "24 h", num: true, get: (r) => delta(r.day) }], g.top)),
      card("Größte Spender", table([
        { label: "Spieler", get: playerLink }, { label: "Gespendet", num: true, get: (r) => fmtSilver(r.donated) }], g.donors))))];
}

function viewFights(s, sub) {
  const groups = s.fights.groups;
  if (sub === "letzte") return [
    card("Letzte Kämpfe", el("div", { class: "scroll" }, table([
      { label: "Ende", get: (f) => fmtTime(iso(f.endedAt)) },
      { label: "Kanal", get: (f) => "#" + f.channel },
      { label: "Kampf", get: (f) => f.kind === "BOSS" ? fightLabel(f) : `${f.name} (${fightLabel(f)})` },
      { label: "Teilnehmer", num: true, get: (f) => fmtInt(f.fighters) },
      { label: "Ausgang", get: (f) => f.outcome === "VICTORY" ? el("span", { class: "up" }, "gewonnen") : el("span", { class: "down" }, "verloren") },
    ], s.fights.recent)))];
  if (sub === "haendler") return [
    card("Fahrender Händler", s.trader.length ? el("div", { class: "scroll" }, table([
      { label: "Gesehen", get: (v) => fmtTime(v.t) }, { label: "Kanal", get: (v) => "#" + v.channel }], s.trader))
      : el("p", { class: "note" }, "Noch kein Besuch gesehen."),
      el("p", { class: "note" }, "Erfasst werden nur Besuche, die beim Sammeln gerade laufen (ein Besuch dauert 5 Minuten)."))];
  return [
    card("Siegquote nach Kampfart (30 Tage)", groups.length ? table([
      { label: "Kampf", get: fightLabel },
      { label: "Kämpfe", num: true, get: (g) => fmtInt(g.n) },
      { label: "Siege", num: true, get: (g) => `${fmtInt(g.wins)} (${pct(g.wins, g.n)})` },
      { label: "Ø Teilnehmer", num: true, get: (g) => fmtInt(g.fighters) },
    ], groups) : el("p", { class: "note" }, "Noch keine Kämpfe erfasst."),
    el("p", { class: "note" }, "Aus dem Kampfarchiv des Spiels (alle Kanäle). Wenige Kämpfe einer Art sagen noch wenig."))];
}

// ---- search ----
let players = null, picked = 0;
async function suggest() {
  const q = $("q").value.trim().toLowerCase(), box = $("suggest");
  if (!q) { box.hidden = true; return; }
  try { players = players || await load("players.json"); } catch { return; }
  const hits = players.filter((p) => p[0].includes(q) || p[1].toLowerCase().includes(q))
    .sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || b[2] - a[2]).slice(0, 12);
  picked = 0;
  box.replaceChildren(...hits.map((p, i) => el("a", { href: `#/spieler/${p[0]}`, class: i === 0 ? "on" : null },
    el("span", {}, p[1]), el("span", { class: "muted" }, `${fmtInt(p[2])} | ${p[3] || "keine Gilde"}`))));
  if (!hits.length) box.append(el("div", { class: "note", style: "padding:6px 10px;margin:0" }, "Nicht erfasst"));
  box.hidden = false;
}
$("q").addEventListener("input", suggest);
$("q").addEventListener("keydown", (ev) => {
  const links = [...$("suggest").querySelectorAll("a")];
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    picked = (picked + (ev.key === "ArrowDown" ? 1 : links.length - 1)) % Math.max(1, links.length);
    links.forEach((a, i) => a.classList.toggle("on", i === picked));
  } else if (ev.key === "Enter" && links[picked]) location.hash = links[picked].getAttribute("href");
  else if (ev.key === "Escape") $("suggest").hidden = true;
});
document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) $("suggest").hidden = true; });

// ---- routing ----
// Each section has sub pages (one per ranking, guild or fight table), shown as a second tab row.
const SECTIONS = {
  rangliste: { subs: () => [["kampfkraft", "Kampfkraft"], ["silber", "Silber"], ["errungenschaften", "Errungenschaften"],
                            ["quests", "Quests"], ["aufsteiger", "Aufsteiger"], ["formel", "Bonus-Formel"]], render: viewRanks },
  gilden: { subs: (s) => s.guilds.map((g) => [g.login, g.login]), render: viewGuild },
  kaempfe: { subs: () => [["arten", "Kampfarten"], ["letzte", "Letzte Kämpfe"], ["haendler", "Fahrender Händler"]],
             render: viewFights },
};
async function route() {
  $("suggest").hidden = true; $("q").value = "";
  const [, name, arg] = location.hash.split("/");
  const view = name === "spieler" ? "player" : SECTIONS[name] ? name : "rangliste";
  for (const a of document.querySelectorAll("header .tabs a")) a.toggleAttribute("aria-current", a.dataset.view === view);
  let s;
  try { s = await load("summary.json"); }
  catch { $("view").replaceChildren(card("Keine Daten", el("p", { class: "note" }, "Die Daten konnten nicht geladen werden."))); return; }
  const login = decodeURIComponent(arg || "").toLowerCase();
  let parts;
  if (view === "player") {
    $("subtabs").hidden = true;
    parts = await viewPlayer(s, login);
  } else {
    const subs = SECTIONS[view].subs(s);
    const sub = (subs.find(([key]) => key === login) || subs[0] || [])[0];
    $("subtabs").replaceChildren(...subs.map(([key, label]) =>
      el("a", { href: `#/${view}/${key}`, ...(key === sub ? { "aria-current": "page" } : {}) }, label)));
    $("subtabs").hidden = subs.length < 2;
    parts = await SECTIONS[view].render(s, sub);
  }
  $("view").replaceChildren(...parts);
  document.title = view === "player" ? `${login} | Chat-RPG Statistik` : "Chat-RPG Statistik";
  $("footer").replaceChildren(`Stand ${fmtTime(s.generated)}. Liest nur öffentliche Daten von `,
    el("a", { href: "https://rpg.sola.rip" }, "rpg.sola.rip"),
    " (etwa alle 15 Minuten von 7 bis 24 Uhr, ohne Anmeldung). Kein offizielles Angebot des Spiels. Fast komplett vibe-coded (von einer KI geschrieben, nur stichprobenartig geprüft), die Zahlen sind Schätzungen. ",
    el("a", { href: `https://github.com/${REPO}` }, "Quellcode und Beobachtungsliste"), ".");
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
